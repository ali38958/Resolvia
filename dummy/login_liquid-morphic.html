<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>liquid login · morphic wobble</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #b1d4e0 0%, #7aa3b8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* ---- liquid blobs background (wobbly, watery) ---- */
        .blob-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            filter: blur(45px) brightness(1.1);
            animation: subtleSwim 22s infinite alternate ease-in-out;
        }

        .blob {
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 80% 20% 70% 30% / 35% 60% 40% 65%;
            box-shadow: 0 0 30px rgba(255, 255, 240, 0.4), inset 0 0 40px rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .blob1 {
            width: 55vmax;
            height: 55vmax;
            left: -15vmax;
            top: -20vmax;
            background: radial-gradient(circle at 30% 30%, rgba(220, 245, 255, 0.8), rgba(170, 215, 240, 0.3));
            animation: wobble1 18s infinite alternate;
        }

        .blob2 {
            width: 45vmin;
            height: 60vmin;
            right: 5%;
            bottom: 0;
            background: radial-gradient(circle at 70% 20%, rgba(200, 235, 255, 0.8), rgba(130, 185, 220, 0.4));
            border-radius: 75% 25% 50% 50% / 40% 70% 30% 60%;
            animation: wobble2 14s infinite alternate-reverse;
        }

        .blob3 {
            width: 70vmin;
            height: 70vmin;
            right: -10vmin;
            top: 5vh;
            background: radial-gradient(circle at 20% 80%, rgba(240, 255, 250, 0.9), rgba(150, 210, 230, 0.3));
            border-radius: 40% 60% 30% 70% / 60% 30% 70% 40%;
            animation: wobble3 20s infinite alternate;
        }

        .blob4 {
            width: 35vmax;
            height: 35vmax;
            left: 10%;
            bottom: -5%;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 70% 30% 40% 60% / 40% 50% 50% 60%;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: wobble4 16s infinite alternate;
        }

        /* keyframes – liquid wobble effect */
        @keyframes wobble1 {
            0% {
                border-radius: 70% 30% 50% 50% / 40% 60% 40% 60%;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }

            100% {
                border-radius: 40% 60% 60% 40% / 50% 30% 70% 50%;
                transform: translate(4%, 3%) scale(1.05) rotate(3deg);
            }
        }

        @keyframes wobble2 {
            0% {
                border-radius: 50% 50% 30% 70% / 60% 30% 70% 40%;
                transform: translate(0, 0) rotate(-2deg);
            }

            100% {
                border-radius: 70% 30% 60% 40% / 40% 70% 30% 60%;
                transform: translate(-6%, -8%) rotate(4deg) scale(1.1);
            }
        }

        @keyframes wobble3 {
            0% {
                border-radius: 60% 40% 70% 30% / 30% 70% 30% 70%;
                transform: translate(0, 0) scale(1);
            }

            100% {
                border-radius: 30% 70% 40% 60% / 60% 30% 70% 40%;
                transform: translate(-5%, 5%) scale(1.1) rotate(-5deg);
            }
        }

        @keyframes wobble4 {
            0% {
                border-radius: 40% 60% 30% 70% / 70% 30% 70% 30%;
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                border-radius: 65% 35% 55% 45% / 45% 65% 35% 55%;
                transform: translate(3%, -6%) scale(1.08) rotate(6deg);
            }
        }

        @keyframes subtleSwim {
            0% {
                filter: blur(40px) brightness(1.0);
            }

            100% {
                filter: blur(55px) brightness(1.2);
            }
        }

        /* ---- main card (liquid morph) ---- */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 1.8rem;
        }

        .liquid-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(18px) saturate(200%);
            -webkit-backdrop-filter: blur(18px) saturate(200%);
            border-radius: 70% 30% 60% 40% / 40% 60% 40% 60%;
            padding: 2.5rem 2rem 2.8rem 2rem;
            box-shadow: 0 30px 50px rgba(0, 20, 30, 0.3),
                0 0 0 2px rgba(255, 255, 255, 0.4) inset,
                0 0 30px rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: border-radius 0.2s ease;
            /* smooth rounding changes */
            animation: cardWobble 12s infinite alternate ease-in-out;
        }

        @keyframes cardWobble {
            0% {
                border-radius: 65% 35% 55% 45% / 45% 55% 45% 55%;
                transform: scale(1.0) translateY(0) rotate(-0.5deg);
            }

            25% {
                border-radius: 50% 50% 40% 60% / 60% 40% 60% 40%;
            }

            50% {
                border-radius: 40% 60% 70% 30% / 30% 70% 30% 70%;
                transform: scale(1.02) translateY(-6px) rotate(0.8deg);
            }

            75% {
                border-radius: 70% 30% 50% 50% / 50% 40% 60% 50%;
            }

            100% {
                border-radius: 30% 70% 40% 60% / 70% 30% 70% 30%;
                transform: scale(0.99) translateY(5px) rotate(-0.8deg);
            }
        }

        /* inner elements */
        h2 {
            text-align: center;
            font-size: 2.3rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 4px 4px 10px rgba(0, 30, 40, 0.3), 0 0 10px rgba(255, 255, 255, 0.8);
            letter-spacing: 1px;
            margin-bottom: 1.8rem;
            filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.1));
            transform: rotate(-0.5deg);
        }

        /* water drop decoration */
        .input-group {
            margin-bottom: 1.7rem;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.3rem;
            margin-left: 0.8rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.1);
            letter-spacing: 0.5px;
            font-size: 0.95rem;
            backdrop-filter: blur(4px);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.9);
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.7));
            pointer-events: none;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.25);
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 60px 20px 60px 20px / 30px 60px 30px 60px;
            padding: 0.9rem 1rem 0.9rem 3rem;
            font-size: 1.1rem;
            color: #022b40;
            font-weight: 500;
            outline: none;
            transition: all 0.25s ease, border-radius 0.3s ease;
            box-shadow: 0 5px 12px rgba(0, 20, 20, 0.2), inset 2px 2px 10px rgba(255, 255, 255, 0.8);
        }

        .input-field:focus {
            border-color: white;
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 8px 22px rgba(0, 30, 40, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.9);
            border-radius: 40% 60% 30% 70% / 60% 30% 70% 40%;
            transform: scale(1.01);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
            font-style: italic;
        }

        /* wobbling shape for "drop" effect on focus (extra water) */
        .input-wrapper::after {
            content: '';
            position: absolute;
            top: -8px;
            right: -8px;
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 70% 30% 60% 40% / 50% 60% 40% 50%;
            filter: blur(6px);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .input-wrapper:focus-within::after {
            opacity: 1;
            animation: tinyDrop 3s infinite alternate;
        }

        @keyframes tinyDrop {
            0% {
                border-radius: 60% 40% 50% 50% / 40% 50% 50% 60%;
                transform: translate(0, 0) scale(1);
            }

            100% {
                border-radius: 40% 60% 70% 30% / 60% 30% 70% 40%;
                transform: translate(3px, -4px) scale(1.1);
            }
        }

        /* options row */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.5rem 0 2rem 0;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            padding: 0 0.2rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.1));
        }

        .remember input {
            width: 18px;
            height: 18px;
            accent-color: #6fa9c0;
            border-radius: 40% 60% 40% 60% / 50% 40% 60% 50%;
            border: none;
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 8px white;
        }

        .forgot-link {
            color: white;
            text-decoration: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.8);
            font-weight: 400;
            padding-bottom: 2px;
            transition: all 0.2s;
        }

        .forgot-link:hover {
            text-shadow: 0 0 12px white;
            border-bottom-style: solid;
        }

        /* liquid button */
        .login-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.32);
            backdrop-filter: blur(18px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 60% 40% 50% 50% / 30% 60% 40% 70%;
            padding: 1rem;
            font-size: 1.6rem;
            font-weight: 400;
            color: white;
            text-shadow: 3px 3px 8px rgba(0, 20, 20, 0.4);
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 15px 25px rgba(0, 20, 20, 0.3), 0 0 30px rgba(255, 255, 240, 0.6);
            transition: all 0.25s, border-radius 0.4s, transform 0.2s;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .login-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 40% 60% 70% 30% / 60% 40% 60% 40%;
            transform: scale(1.02) translateY(-3px);
            box-shadow: 0 25px 35px rgba(0, 30, 40, 0.4), 0 0 50px rgba(255, 255, 255, 0.8);
            border-color: white;
        }

        .login-btn:active {
            transform: scale(0.98) translateY(2px);
            border-radius: 70% 30% 40% 60% / 30% 70% 30% 70%;
            transition: all 0.1s;
        }

        /* signup text */
        .signup-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.05rem;
            text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.1);
        }

        .signup-text a {
            color: white;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.6);
            padding-bottom: 1px;
            transition: all 0.2s;
        }

        .signup-text a:hover {
            border-bottom-color: white;
            filter: drop-shadow(0 0 10px white);
        }

        /* water drop extras (floating drops) */
        .water-drop {
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 70% 30% 50% 50% / 40% 60% 40% 60%;
            filter: blur(12px);
            z-index: 5;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: wobbleDrop 10s infinite alternate;
        }

        .drop1 {
            width: 130px;
            height: 130px;
            top: 5%;
            left: 12%;
            background: rgba(240, 255, 255, 0.2);
            animation: wobbleDrop 14s infinite alternate-reverse;
        }

        .drop2 {
            width: 200px;
            height: 160px;
            bottom: 3%;
            right: 7%;
            background: rgba(200, 230, 250, 0.2);
            animation: wobbleDrop 18s infinite alternate;
        }

        @keyframes wobbleDrop {
            0% {
                border-radius: 60% 40% 70% 30% / 30% 70% 30% 70%;
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                border-radius: 30% 70% 40% 60% / 70% 30% 70% 30%;
                transform: translate(20px, -15px) rotate(8deg);
            }
        }

        /* responsiveness */
        @media (max-width: 460px) {
            .login-container {
                padding: 0.8rem;
            }

            .liquid-card {
                padding: 2rem 1.2rem;
            }
        }
    </style>
</head>

<body>
    <!-- large background blobs - liquid morph -->
    <div class="blob-bg">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
        <div class="blob blob4"></div>
    </div>

    <!-- floating drops (extra watery) -->
    <div class="water-drop drop1"></div>
    <div class="water-drop drop2"></div>

    <!-- login card - liquid morph container -->
    <div class="login-container">
        <div class="liquid-card">
            <h2>⋆⫸ ˗ˋˏ liquid ˎˊ˗ ⫷⋆</h2>

            <!-- username field -->
            <div class="input-group">
                <label>💧 username or email</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input class="input-field" type="text" placeholder="water droplet..." autofocus>
                </div>
            </div>

            <!-- password field -->
            <div class="input-group">
                <label>💧 password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input class="input-field" type="password" placeholder="••••••••">
                </div>
            </div>

            <!-- options row (remember + forgot) -->
            <div class="options">
                <label class="remember">
                    <input type="checkbox" checked> <span>remember me</span>
                </label>
                <a href="#" class="forgot-link">forgot password ?</a>
            </div>

            <!-- wobbly login button -->
            <button class="login-btn">log in ⋆｡°✩</button>

            <!-- signup link -->
            <div class="signup-text">
                no account? <a href="#">merge with a drop</a>
            </div>
        </div>
    </div>

    <!-- tiny interaction: js for fun ripple? optional silent effect -->
    <script>
        (function () {
            // just a very subtle wobble amplification while typing? 
            // but design already wobbles via css. 
            // Adding a tiny effect: on input focus, change card border-radius slightly more dynamic.
            const inputs = document.querySelectorAll('.input-field');
            const card = document.querySelector('.liquid-card');
            inputs.forEach(inp => {
                inp.addEventListener('focus', () => {
                    card.style.transition = 'border-radius 0.4s ease, transform 0.3s ease';
                    card.style.animation = 'none'; // stop base wobble to blend?
                    card.style.borderRadius = '50% 50% 30% 70% / 60% 30% 70% 40%';
                    card.style.transform = 'scale(1.02) translateY(-6px)';
                });
                inp.addEventListener('blur', () => {
                    card.style.animation = 'cardWobble 12s infinite alternate ease-in-out';
                    card.style.borderRadius = '';
                    card.style.transform = '';
                });
            });
        })();
    </script>
</body>

</html>
