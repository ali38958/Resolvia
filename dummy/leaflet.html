<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Advanced Location Picker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .container {
            width: 550px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            padding: 20px;
        }

        h2 {
            margin-bottom: 15px;
        }

        .map-wrapper {
            position: relative;
            height: 300px;
            border-radius: 10px;
            overflow: hidden;
            transition: height 0.3s ease;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .map-wrapper.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            border-radius: 0;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #2d7ef7;
            color: white;
        }

        .secondary {
            background: #e4e6eb;
        }

        pre {
            margin-top: 15px;
            background: #1e1e1e;
            color: #00ff95;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Advanced Location Picker</h2>

        <div class="map-wrapper" id="mapWrapper">
            <div id="map"></div>
        </div>

        <div class="controls">
            <button class="primary" onclick="showJSON()">Show Full JSON</button>
            <button class="secondary" onclick="toggleFullscreen()">Toggle Fullscreen</button>
        </div>

        <pre id="output">Click on the map to select a location.</pre>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let selectedData = null;
        let marker = null;

        const map = L.map('map').setView([20, 0], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        map.on('click', async function (e) {

            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng).addTo(map);
            }

            document.getElementById("output").textContent = "Fetching location details...";

            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&addressdetails=1`
                );

                const data = await response.json();

                selectedData = {
                    coordinates: {
                        latitude: lat,
                        longitude: lng
                    },
                    display_name: data.display_name,
                    type: data.type,
                    category: data.category,
                    address: data.address
                };

                document.getElementById("output").textContent =
                    JSON.stringify(selectedData, null, 2);

            } catch (error) {
                document.getElementById("output").textContent =
                    "Error fetching location data.";
            }
        });

        function showJSON() {
            const output = document.getElementById("output");

            if (!selectedData) {
                output.textContent = "No location selected.";
                return;
            }

            output.textContent = JSON.stringify(selectedData, null, 2);
        }

        function toggleFullscreen() {
            const wrapper = document.getElementById("mapWrapper");
            wrapper.classList.toggle("fullscreen");
            setTimeout(() => {
                map.invalidateSize();
            }, 300);
        }
    </script>

</body>

</html>
