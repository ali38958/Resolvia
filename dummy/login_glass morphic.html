<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic Login | Frost UI</title>
    <style>
        /* RESET & GLOBAL STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* ANIMATED BACKGROUND ELEMENTS (for depth) */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 215, 215, 0.3) 0%, rgba(255, 255, 255, 0) 70%);
            top: 10%;
            left: 5%;
            border-radius: 50%;
            filter: blur(40px);
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(200, 230, 255, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
            bottom: 5%;
            right: 5%;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
        }

        /* MAIN GLASS CARD */
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 2.8rem 2.2rem 3rem 2.2rem;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.4);
        }

        /* HEADER */
        .brand {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand h1 {
            font-size: 2.6rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #f0e6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
        }

        .brand p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            font-weight: 300;
            margin-top: 0.5rem;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }

        /* INPUT GROUPS (glassmorphic fields) */
        .input-group {
            margin-bottom: 2rem;
        }

        .input-label {
            display: block;
            margin-bottom: 0.7rem;
            font-size: 0.9rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.5px;
            padding-left: 0.8rem;
            text-transform: uppercase;
            font-weight: 300;
        }

        .input-field {
            width: 100%;
            padding: 1.1rem 1.5rem;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            font-size: 1rem;
            color: white;
            caret-color: #fff;
            outline: none;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transform: scale(1.02);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
            font-size: 0.95rem;
        }

        /* PASSWORD HINT (for JS feedback) */
        .password-hint {
            font-size: 0.8rem;
            margin-top: 0.7rem;
            margin-left: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.05);
            width: fit-content;
        }

        .password-hint i {
            font-style: normal;
            font-size: 1.1rem;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.2));
        }

        /* GLASS BUTTON */
        .login-btn {
            width: 100%;
            padding: 1.1rem 1rem;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: white;
            margin: 2rem 0 2rem 0;
            cursor: pointer;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.7s ease;
        }

        .login-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:active {
            transform: translateY(0);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        /* EXTRA LINKS (glassmorphic text) */
        .extra-links {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            padding: 0 0.5rem;
        }

        .extra-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: all 0.2s ease;
            font-weight: 300;
            padding: 0.3rem 0;
        }

        .extra-links a:hover {
            color: white;
            border-bottom-color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* DYNAMIC MESSAGE (glassmorphic badge) */
        #demoMessage {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.95rem;
            padding: 0.8rem 1.2rem;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s ease;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
        }

        #demoMessage.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* FOOTER NOTE */
        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* FLOATING GLASS ORBS (extra depth) */
        .orb {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.05));
            border-radius: 50%;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1;
        }

        .orb-1 {
            top: 15%;
            right: 10%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle at 70% 30%, rgba(180, 220, 255, 0.4), rgba(255, 255, 255, 0.02));
        }

        .orb-2 {
            bottom: 10%;
            left: 8%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 30% 70%, rgba(255, 200, 220, 0.4), rgba(255, 255, 255, 0.02));
        }

        /* ANIMATION FOR ORBS */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        .orb-1 {
            animation: float 8s ease-in-out infinite;
        }

        .orb-2 {
            animation: float 10s ease-in-out infinite reverse;
        }

        /* small adjustments for glass effect */
        .input-field:-webkit-autofill,
        .input-field:-webkit-autofill:hover,
        .input-field:-webkit-autofill:focus {
            -webkit-text-fill-color: white;
            -webkit-box-shadow: 0 0 0px 1000px rgba(255, 255, 255, 0.15) inset;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>

<body>

    <!-- DECORATIVE GLASS ORBS -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="login-card">
        <div class="brand">
            <h1>✦ frost</h1>
            <p>glassmorphic login</p>
        </div>

        <!-- USERNAME FIELD -->
        <div class="input-group">
            <label class="input-label" for="username">username</label>
            <input type="text" class="input-field" id="username" placeholder="enter your username" autocomplete="off">
        </div>

        <!-- PASSWORD FIELD (with JS live feedback) -->
        <div class="input-group">
            <label class="input-label" for="password">password</label>
            <input type="password" class="input-field" id="password" placeholder="••••••••">
            <div class="password-hint" id="passwordHint">
                <i>❄️</i> <span id="hintText">minimum 6 characters</span>
            </div>
        </div>

        <!-- LOGIN BUTTON -->
        <button class="login-btn" id="loginBtn">sign in</button>

        <!-- EXTRA LINKS -->
        <div class="extra-links">
            <a href="#" id="forgotLink">forgot password?</a>
            <a href="#" id="signupLink">create account</a>
        </div>

        <!-- DYNAMIC MESSAGE (appears after button click) -->
        <div id="demoMessage"></div>
        <div class="footer-note">✦ glassmorphism ui demo ✦</div>
    </div>

    <script>
        (function () {
            // Get DOM elements
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const demoMessage = document.getElementById('demoMessage');
            const hintSpan = document.getElementById('hintText');
            const hintIcon = document.querySelector('.password-hint i');
            const forgotLink = document.getElementById('forgotLink');
            const signupLink = document.getElementById('signupLink');

            // --- LIVE PASSWORD HINT (glassmorphic micro-interaction) ---
            function updatePasswordHint() {
                const pwd = passwordInput.value;
                if (pwd.length === 0) {
                    hintSpan.innerText = 'minimum 6 characters';
                    hintIcon.innerText = '❄️';
                    hintIcon.style.opacity = '0.8';
                } else if (pwd.length < 6) {
                    hintSpan.innerText = `⚠️ only ${pwd.length} chars — need 6+`;
                    hintIcon.innerText = '🧊';
                    hintIcon.style.opacity = '1';
                } else {
                    hintSpan.innerText = `✓ strong (${pwd.length} chars)`;
                    hintIcon.innerText = '✨';
                    hintIcon.style.opacity = '1';
                }
            }

            passwordInput.addEventListener('input', updatePasswordHint);
            // initial call
            updatePasswordHint();

            // --- LOGIN BUTTON ACTION (with glassmorphic message) ---
            function showMessage(text, isSuccess = true) {
                demoMessage.innerText = text;
                // subtle color hint based on success/failure
                if (isSuccess) {
                    demoMessage.style.background = 'rgba(80, 200, 120, 0.2)';
                    demoMessage.style.borderColor = 'rgba(80, 200, 120, 0.3)';
                } else {
                    demoMessage.style.background = 'rgba(255, 100, 100, 0.15)';
                    demoMessage.style.borderColor = 'rgba(255, 100, 100, 0.2)';
                }
                demoMessage.classList.add('show');

                // auto hide after 2.8 seconds
                setTimeout(() => {
                    demoMessage.classList.remove('show');
                    // reset background to default after hide
                    setTimeout(() => {
                        demoMessage.style.background = 'rgba(255, 255, 255, 0.15)';
                        demoMessage.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                    }, 300);
                }, 2800);
            }

            loginBtn.addEventListener('click', function (e) {
                e.preventDefault();  // prevent any page refresh (for demo)

                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username) {
                    showMessage('✗ username cannot be empty', false);
                    return;
                }

                if (password.length === 0) {
                    showMessage('✗ password missing', false);
                    return;
                }

                if (password.length < 6) {
                    showMessage('✗ password too short (min 6)', false);
                    return;
                }

                // if all good → login success (demo only)
                showMessage(`✓ welcome, ${username}! (demo)`);

                // Optional: clear fields after successful login? 
                // We'll keep them for demo purposes
            });

            // --- EXTRA LINKS INTERACTION (demo) ---
            function linkHandler(linkType) {
                showMessage(`✨ ${linkType} — demo action`, false);
            }

            forgotLink.addEventListener('click', function (e) {
                e.preventDefault();
                linkHandler('password reset');
            });

            signupLink.addEventListener('click', function (e) {
                e.preventDefault();
                linkHandler('signup');
            });

            // --- Additional glassmorphic effects ---

            // Add floating effect on input focus
            const inputs = document.querySelectorAll('.input-field');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    // The CSS handles most, but we can add a subtle glow
                    input.style.boxShadow = '0 8px 30px rgba(0, 0, 0, 0.3), 0 0 0 2px rgba(255,255,255,0.1)';
                });

                input.addEventListener('blur', () => {
                    input.style.boxShadow = '0 8px 20px rgba(0, 0, 0, 0.1)';
                });
            });

            // Simulate typing effect on placeholder (just for fun)
            let placeholderIndex = 0;
            const placeholders = ['your username', 'identifier', 'email', 'username'];

            setInterval(() => {
                if (!usernameInput.matches(':focus')) {
                    placeholderIndex = (placeholderIndex + 1) % placeholders.length;
                    usernameInput.placeholder = placeholders[placeholderIndex];
                }
            }, 3000);

            // On page load, ensure message hidden
            window.addEventListener('load', function () {
                demoMessage.classList.remove('show');
            });

        })();
    </script>

    <!-- 
    pure glassmorphic login page
    - internal CSS (all styles in style tag)
    - internal JS (all functionality)
    - no external resources => self contained
-->
</body>

</html>
