<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <title>Natures Management</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="api.js"></script>
    <link rel="stylesheet" href="common-styles.css"> <!-- Common styles for header, menu, etc. -->
    <style>
        /* Nature Management Styles */
        .natures-management {
            padding: 20px;
        }
        
        .natures-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .natures-header h2 {
            color: var(--primary-color);
            font-size: 22px;
            margin: 0;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: var(--text-light);
        }
        
        .btn-primary:hover {
            background-color: #0a4539;
            transform: translateY(-1px);
        }
        
        .btn-search {
            background-color: var(--primary-color);
            color: var(--text-light);
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-search:hover {
            background-color: #0a4539;
            transform: translateY(-1px);
        }
        
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .search-box {
            position: relative;
            flex: 1;
            min-width: 300px;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 35px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s ease;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 16px;
        }
        
        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
            padding: 8px 0;
        }
        
        .entries-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-gray);
            font-size: 13px;
        }
        
        .entries-selector select {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: var(--text-light);
            font-size: 13px;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }
        
        .entries-selector select:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .table-container {
            background: var(--text-light);
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 1px 3px var(--shadow-color);
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        
        thead {
            background-color: var(--primary-color);
        }
        
        th {
            padding: 12px 15px;
            text-align: left;
            color: var(--text-light);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        th:last-child {
            border-right: none;
        }
        
        tbody tr {
            border-bottom: 1px solid #e0e0e0;
            transition: background-color 0.2s ease;
        }
        
        tbody tr:hover {
            background-color: var(--primary-transparent-10);
        }
        
        td {
            padding: 10px 15px;
            color: var(--text-gray);
            font-size: 13px;
            border-right: 1px solid #e0e0e0;
            vertical-align: top;
        }
        
        td:last-child {
            border-right: none;
        }
        
        /* Column widths */
        th:nth-child(1), td:nth-child(1) {
            width: 60px; /* # column */
            text-align: center;
        }
        
        th:nth-child(2), td:nth-child(2) {
            width: 180px; /* Name column */
        }
        
        th:nth-child(3), td:nth-child(3) {
            width: auto; /* Types column - takes remaining space */
        }
        
        th:nth-child(4), td:nth-child(4) {
            width: 100px; /* Actions column */
            text-align: center;
        }
        
        .types-cell {
            max-width: 100%;
            overflow: hidden;
        }
        
        .types-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: flex-start;
        }
        
        .type-tag {
            background: var(--primary-light);
            color: var(--primary-color);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin: 2px;
            line-height: 1.3;
        }
        
        .remove-tag {
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 9px;
            padding: 0;
            width: 12px;
            height: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.2s ease;
            margin-left: 2px;
        }
        
        .remove-tag:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .add-tag-btn {
            background: #e9ecef;
            border: 1px dashed #adb5bd;
            color: #495057;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
            flex-shrink: 0;
        }
        
        .add-tag-btn:hover {
            background: #dee2e6;
        }
        
        .action-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 3px;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 12px;
            width: 100%;
        }
        
        .action-btn:hover {
            background-color: var(--primary-transparent-10);
        }
        
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 10px 0;
        }
        
        .pagination-info {
            color: var(--text-gray);
            font-size: 13px;
        }
        
        .pagination-controls {
            display: flex;
            gap: 4px;
        }
        
        .page-btn {
            padding: 6px 10px;
            border: 1px solid #ddd;
            background: var(--text-light);
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
            min-width: 32px;
        }
        
        .page-btn:hover:not(.disabled) {
            background-color: var(--primary-color);
            color: var(--text-light);
            border-color: var(--primary-color);
        }
        
        .page-btn.active {
            background-color: var(--primary-color);
            color: var(--text-light);
            border-color: var(--primary-color);
        }
        
        .page-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: white;
            border-radius: 6px;
            width: 90%;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        
        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary-color);
        }
        
        .modal-header h2 {
            margin: 0;
            color: var(--text-light);
            font-size: 16px;
        }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--text-light);
            cursor: pointer;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        
        .close-modal:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 13px;
        }
        
        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            transition: border 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px var(--primary-transparent-10);
        }
        
        .modal-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
            min-height: 36px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .tag-input-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .tag-input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .add-tag-modal-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s ease;
        }
        
        .add-tag-modal-btn:hover {
            background: #0c4a3d;
        }
        
        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        
        .save-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.3s ease;
        }
        
        .save-btn:hover {
            background: #0c4a3d;
        }
        
        .cancel-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.3s ease;
        }
        
        .cancel-btn:hover {
            background: #5a6268;
        }

        /* Tag Modal Styles (for adding tags to existing nature) */
        .tag-modal .modal {
            max-width: 400px;
        }
        
        .tag-modal .modal-header {
            padding: 12px 20px;
        }
        
        .tag-modal .modal-header h2 {
            font-size: 15px;
        }
        
        .tag-modal .modal-body {
            padding: 15px 20px;
        }
        
        .existing-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: #f9f9f9;
            max-height: 120px;
            overflow-y: auto;
        }
        
        .existing-tags-label {
            font-size: 12px;
            color: var(--text-gray);
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .tag-modal-btns {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
        
        .tag-save-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.3s ease;
            flex: 1;
        }
        
        .tag-save-btn:hover {
            background: #0c4a3d;
        }
        
        .tag-cancel-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.3s ease;
            flex: 1;
        }
        
        .tag-cancel-btn:hover {
            background: #5a6268;
        }

        /* Loading and Error States */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-gray);
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .error-message i {
            font-size: 14px;
        }

        /* Mobile responsive table styling */
        @media (max-width: 768px) {
            .natures-management {
                padding: 15px !important;
            }
            
            .natures-header {
                flex-direction: column;
                align-items: flex-start;
                margin-bottom: 15px;
                gap: 10px;
            }
            
            .natures-header h2 {
                font-size: 18px;
                margin-bottom: 5px;
            }
            
            .search-container {
                flex-direction: column;
                gap: 10px;
                margin-bottom: 10px;
            }
            
            .search-box {
                min-width: 100% !important;
                width: 100%;
            }
            
            .search-box input {
                padding: 7px 12px 7px 35px;
                font-size: 13px;
            }
            
            .btn-search {
                width: 100%;
                justify-content: center;
                padding: 7px;
            }
            
            .btn {
                padding: 6px 12px;
                font-size: 12px;
            }
            
            /* Table container with horizontal scroll */
            .table-container {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                border-radius: 4px;
                margin: 0 -15px;
                width: calc(100% + 30px);
                border: none;
            }
            
            .table-container::-webkit-scrollbar {
                height: 4px;
            }
            
            .table-container::-webkit-scrollbar-thumb {
                background-color: var(--primary-color);
                border-radius: 10px;
            }
            
            table {
                min-width: 700px; /* Force horizontal scroll on small screens */
            }
            
            th, td {
                padding: 8px 12px !important;
                font-size: 12px !important;
            }
            
            th {
                padding: 10px 12px !important;
                font-size: 11px !important;
            }
            
            /* Table controls adjustments */
            .table-controls {
                margin-bottom: 10px;
            }
            
            .entries-selector {
                font-size: 12px;
            }
            
            .entries-selector select {
                padding: 5px 8px;
                font-size: 12px;
            }
            
            .pagination {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
                margin-top: 10px;
            }
            
            .pagination-info {
                text-align: center;
                font-size: 12px;
            }
            
            .pagination-controls {
                justify-content: center;
                width: 100%;
            }
            
            .page-btn {
                padding: 5px 8px;
                font-size: 12px;
                min-width: 28px;
            }
            
            .action-btn {
                padding: 3px 6px;
                font-size: 11px;
            }
            
            .type-tag {
                padding: 2px 6px;
                font-size: 10px;
            }
            
            /* Adjust column widths for mobile */
            th:nth-child(1), td:nth-child(1) {
                width: 50px;
            }
            
            th:nth-child(2), td:nth-child(2) {
                width: 140px;
            }
            
            th:nth-child(3), td:nth-child(3) {
                min-width: 300px;
            }
            
            th:nth-child(4), td:nth-child(4) {
                width: 90px;
            }
            
            /* Tag modal adjustments for mobile */
            .tag-modal .modal {
                width: 95%;
                max-width: 350px;
            }
        }

        /* Extra small devices (phones less than 480px) */
        @media (max-width: 480px) {
            .natures-management {
                padding: 12px !important;
            }
            
            .natures-header h2 {
                font-size: 16px;
            }
            
            .search-box input {
                font-size: 12px;
                padding: 6px 12px 6px 30px;
            }
            
            .search-box i {
                left: 10px;
                font-size: 12px;
            }
            
            .table-container {
                margin: 0 -12px;
                width: calc(100% + 24px);
            }
            
            table {
                min-width: 650px;
            }
            
            th, td {
                padding: 6px 10px !important;
                font-size: 11px !important;
            }
            
            th {
                padding: 8px 10px !important;
                font-size: 10px !important;
            }
            
            .action-btn {
                font-size: 10px;
                padding: 2px 4px;
            }
            
            .pagination-info {
                font-size: 11px;
            }
            
            .page-btn {
                padding: 4px 6px;
                font-size: 11px;
                min-width: 26px;
            }
            
            .type-tag {
                padding: 2px 5px;
                font-size: 9px;
            }
            
            /* Tag modal adjustments for small screens */
            .tag-modal .modal {
                width: 98%;
                max-width: 320px;
                margin: 10px;
            }
            
            .tag-modal .modal-body {
                padding: 12px 15px;
            }
            
            .tag-modal-btns {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <i class="fa fa-bars" id="menu-control"></i>
            <img src="assets/logo.png" alt="logo" id="logo">
            <h2 class="logo-text">Resolvia</h2>
        </div>

        <div class="header-right">
            <div class="profile-icon">
                <i class="fa fa-user"></i>
            </div>
        </div>
    </header>

    <div class="navigation-menu" id="navigation-menu">
        <ul id="nav-list"></ul>
    </div>

    <div class="main-content" id="main-content">
        <div class="natures-management">
            <div class="natures-header">
                <h2>Complaint Natures Management</h2>
                <button class="btn btn-primary" id="addNatureBtn">
                    <i class="fas fa-plus"></i> Add New Nature
                </button>
            </div>
            
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search by nature name or type...">
                </div>
                <button class="btn-search" id="searchBtn">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
            
            <div id="errorContainer" style="display: none;"></div>
            
            <div class="table-controls">
                <div class="entries-selector">
                    <span>Show</span>
                    <select id="entriesPerPage">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                    <span>entries</span>
                </div>
            </div>
            
            <div class="table-container">
                <table id="naturesTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Types</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="naturesTableBody">
                        <tr>
                            <td colspan="4" class="loading">
                                <i class="fas fa-spinner fa-spin"></i> Loading natures...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="pagination">
                <div class="pagination-info" id="paginationInfo">
                    Showing 0-0 of 0 natures
                </div>
                <div class="pagination-controls">
                    <button class="page-btn" id="prevPage" disabled>
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="page-btn" id="nextPage" disabled>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal for Add/Edit Nature -->
    <div class="modal-overlay" id="natureModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Nature</h2>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="natureName">Nature Name *</label>
                    <input type="text" id="natureName" class="form-input" placeholder="Enter nature name (e.g., Air Conditioner)">
                </div>
                <div class="form-group">
                    <label for="natureTypes">Types</label>
                    <div class="modal-tags-container" id="modalTagsContainer">
                        <!-- Tags will be dynamically added here -->
                    </div>
                    <div class="tag-input-container">
                        <input type="text" id="tagInput" class="tag-input" placeholder="Add a type (e.g., Capacitor fitting)">
                        <button class="add-tag-modal-btn" id="addTagBtn">Add</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="cancel-btn" id="cancelBtn">Cancel</button>
                <button class="save-btn" id="saveBtn">
                    <span id="saveBtnText">Save</span>
                    <span id="saveBtnSpinner" style="display: none;">
                        <i class="fas fa-spinner fa-spin"></i> Saving...
                    </span>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Modal for Adding Tags to Existing Nature -->
    <div class="modal-overlay tag-modal" id="tagModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="tagModalTitle">Add Types to <span id="natureNameInModal"></span></h2>
                <button class="close-modal" id="closeTagModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="existing-tags-label">Current Types:</div>
                <div class="existing-tags-container" id="existingTagsContainer">
                    <!-- Existing tags will be shown here -->
                </div>
                <div class="form-group">
                    <label for="newTagInput">Add New Type</label>
                    <div class="tag-input-container">
                        <input type="text" id="newTagInput" class="tag-input" placeholder="Enter new type (e.g., Capacitor fitting)">
                        <button class="add-tag-modal-btn" id="addNewTagBtn">Add</button>
                    </div>
                </div>
                <div class="tag-modal-btns">
                    <button class="tag-cancel-btn" id="cancelTagBtn">Cancel</button>
                    <button class="tag-save-btn" id="saveTagBtn">
                        <span id="saveTagBtnText">Save Changes</span>
                        <span id="saveTagBtnSpinner" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i> Saving...
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="common-script.js"></script>
    <script>
        // API base URL
        const API_BASE_URL = SERVER_BASE_URL + '/api';

        // Data variables
        let naturesData = [];
        let filteredData = [];
        let currentPage = 1;
        let itemsPerPage = 10;
        let editingNatureId = null;
        let currentTags = [];
        let editingTagNatureId = null;
        let currentTagInputs = [];

        // DOM Elements
        const naturesTableBody = document.getElementById('naturesTableBody');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const addNatureBtn = document.getElementById('addNatureBtn');
        const prevPageBtn = document.getElementById('prevPage');
        const nextPageBtn = document.getElementById('nextPage');
        const paginationInfo = document.getElementById('paginationInfo');
        const entriesPerPageSelect = document.getElementById('entriesPerPage');
        const errorContainer = document.getElementById('errorContainer');
        
        // Modal Elements
        const natureModal = document.getElementById('natureModal');
        const modalTitle = document.getElementById('modalTitle');
        const natureNameInput = document.getElementById('natureName');
        const tagInput = document.getElementById('tagInput');
        const addTagBtn = document.getElementById('addTagBtn');
        const modalTagsContainer = document.getElementById('modalTagsContainer');
        const closeModal = document.getElementById('closeModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const saveBtn = document.getElementById('saveBtn');
        const saveBtnText = document.getElementById('saveBtnText');
        const saveBtnSpinner = document.getElementById('saveBtnSpinner');
        
        // Tag Modal Elements
        const tagModal = document.getElementById('tagModal');
        const tagModalTitle = document.getElementById('tagModalTitle');
        const natureNameInModal = document.getElementById('natureNameInModal');
        const existingTagsContainer = document.getElementById('existingTagsContainer');
        const newTagInput = document.getElementById('newTagInput');
        const addNewTagBtn = document.getElementById('addNewTagBtn');
        const closeTagModal = document.getElementById('closeTagModal');
        const cancelTagBtn = document.getElementById('cancelTagBtn');
        const saveTagBtn = document.getElementById('saveTagBtn');
        const saveTagBtnText = document.getElementById('saveTagBtnText');
        const saveTagBtnSpinner = document.getElementById('saveTagBtnSpinner');

        // API Functions
        async function fetchNatures() {
            try {
                showLoading();
                const response = await fetch(`${API_BASE_URL}/natures`, {
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem('authToken')}`
                    }
                });
                
                if (!response.ok) {
                    //throw new Error(`Failed to fetch natures: ${response.status}`);
                    showNotification('Failed to load natures', 'error');
                    renderTable(); // Will show empty state
                }
                
                const data = await response.json();
                
                // Transform the data format for frontend
                naturesData = data.map(nature => ({
                    id: nature.id,
                    name: nature.name,
                    types: nature.types ? nature.types.map(t => t.type_name) : []
                }));
                
                filteredData = [...naturesData];
                showNotification('Natures loaded successfully', 'success');
                renderTable();
                hideError();
            } catch (error) {
                console.error('Error fetching natures:', error);
                //showError('Failed to load natures. Please try again.');
                showNotification('Failed to load natures', 'error');
                renderTable(); // Will show empty state
            }
        }

        async function createNature(natureData) {
            const response = await fetch(`${API_BASE_URL}/natures`, {
                method: 'POST',
                credentials: "include",
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('authToken')}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(natureData)
            });
            
            if (!response.ok) {
                const error = await response.json();
                showNotification(error.error || 'Failed to create nature', 'error');
                //throw new Error(error.error || 'Failed to create nature');
            }
            
            return await response.json();
        }

        async function updateNature(id, natureData) {
            const response = await fetch(`${API_BASE_URL}/natures/${id}`, {
                method: 'PUT',
                credentials: "include",
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('authToken')}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(natureData)
            });
            
            if (!response.ok) {
                const error = await response.json();
                showNotification(error.error || 'Failed to update nature', 'error');
                //throw new Error(error.error || 'Failed to update nature');
            }
            
            return await response.json();
        }

        async function updateNatureTypes(natureId, types) {
            const response = await fetch(`${API_BASE_URL}/natures/${natureId}/types`, {
                method: 'PUT',
                credentials: "include",
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('authToken')}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ types })
            });
            
            if (!response.ok) {
                const error = await response.json();
                showNotification(error.error || 'Failed to update types', 'error');
                //throw new Error(error.error || 'Failed to update types');
            }
            
            return await response.json();
        }

        async function deleteNatureType(typeId) {
            const response = await fetch(`${API_BASE_URL}/nature-types/${typeId}`, {
                method: 'DELETE',
                credentials: "include"
            });
            
            if (!response.ok) {
                const error = await response.json();
                showNotification(error.error || 'Failed to delete type', 'error');
                //throw new Error(error.error || 'Failed to delete type');
            }
            
            return await response.json();
        }

        // UI Helper Functions
        function showLoading() {
            naturesTableBody.innerHTML = `
                <tr>
                    <td colspan="4" class="loading">
                        <i class="fas fa-spinner fa-spin"></i> Loading natures...
                    </td>
                </tr>
            `;
        }

        function showError(message) {
            errorContainer.innerHTML = `
                <div class="error-message">
                    <i class="fas fa-exclamation-circle"></i>
                    ${message}
                </div>
            `;
            errorContainer.style.display = 'block';
        }

        function hideError() {
            errorContainer.style.display = 'none';
        }

        // Initialize table
        function renderTable() {
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = filteredData.slice(startIndex, endIndex);
            
            naturesTableBody.innerHTML = '';
            
            if (filteredData.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td colspan="4" style="text-align: center; padding: 30px; color: var(--text-gray); font-size: 13px;">
                        <i class="fas fa-inbox" style="font-size: 20px; margin-bottom: 10px; display: block; color: #ccc;"></i>
                        No complaint natures found. Click "Add New Nature" to create one.
                    </td>
                `;
                naturesTableBody.appendChild(row);
            } else if (pageData.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td colspan="4" style="text-align: center; padding: 30px; color: var(--text-gray); font-size: 13px;">
                        <i class="fas fa-search" style="font-size: 20px; margin-bottom: 10px; display: block; color: #ccc;"></i>
                        No complaint natures found matching your search criteria.
                    </td>
                `;
                naturesTableBody.appendChild(row);
            } else {
                pageData.forEach((nature, index) => {
                    const row = document.createElement('tr');
                    const rowNumber = startIndex + index + 1;
                    
                    row.innerHTML = `
                        <td>${rowNumber}</td>
                        <td><strong style="font-size: 15px; color: #333;">${nature.name}</strong></td>
                        <td class="types-cell">
                            <div class="types-container" data-nature-id="${nature.id}">
                                ${nature.types.map(type => `
                                    <span class="type-tag">
                                        ${type}
                                        <button class="remove-tag" data-type="${type}" data-nature-id="${nature.id}">&times;</button>
                                    </span>
                                `).join('')}
                                <button class="add-tag-btn" data-nature-id="${nature.id}">+</button>
                            </div>
                        </td>
                        <td>
                            <button class="action-btn edit-btn" data-id="${nature.id}">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                        </td>
                    `;
                    
                    naturesTableBody.appendChild(row);
                });
            }
            
            updatePagination();
        }
        
        // Update pagination controls
        function updatePagination() {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            const startItem = (currentPage - 1) * itemsPerPage + 1;
            const endItem = Math.min(currentPage * itemsPerPage, filteredData.length);
            
            // Update pagination info
            paginationInfo.textContent = `Showing ${startItem}-${endItem} of ${filteredData.length} complaint natures`;
            
            // Update prev/next buttons
            prevPageBtn.disabled = currentPage === 1;
            prevPageBtn.classList.toggle('disabled', currentPage === 1);
            
            nextPageBtn.disabled = currentPage === totalPages || totalPages === 0;
            nextPageBtn.classList.toggle('disabled', currentPage === totalPages || totalPages === 0);
            
            // Update page number buttons
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            
            if (endPage - startPage + 1 < 5) {
                startPage = Math.max(1, endPage - 4);
            }
            
            const paginationControls = document.querySelector('.pagination-controls');
            
            // Clear existing page buttons (except prev/next)
            const existingPageBtns = paginationControls.querySelectorAll('.page-btn:not(#prevPage):not(#nextPage)');
            existingPageBtns.forEach(btn => btn.remove());
            
            // Add new page buttons
            for (let i = startPage; i <= endPage; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.textContent = i;
                pageBtn.addEventListener('click', () => {
                    if (currentPage !== i) {
                        currentPage = i;
                        renderTable();
                    }
                });
                
                // Insert before next button
                paginationControls.insertBefore(pageBtn, nextPageBtn);
            }
        }
        
        // Search functionality
        function searchNatures() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            
            if (searchTerm === '') {
                filteredData = [...naturesData];
            } else {
                filteredData = naturesData.filter(nature => 
                    nature.name.toLowerCase().includes(searchTerm) ||
                    nature.types.some(type => type.toLowerCase().includes(searchTerm))
                );
            }
            
            currentPage = 1;
            renderTable();
        }
        
        // Change entries per page
        function changeEntriesPerPage() {
            itemsPerPage = parseInt(entriesPerPageSelect.value);
            currentPage = 1;
            renderTable();
        }
        
        // Main Modal Functions
        // Open modal for editing
        function openEditModal(id) {
            editingNatureId = id;
            const nature = naturesData.find(n => n.id === id);
            
            if (nature) {
                modalTitle.textContent = 'Edit Complaint Nature';
                natureNameInput.value = nature.name;
                currentTags = [...nature.types];
                renderModalTags();
                natureModal.classList.add('active');
            }
        }

        // Open modal for adding new nature
        function openAddModal() {
            editingNatureId = null;
            modalTitle.textContent = 'Add New Complaint Nature';
            natureNameInput.value = '';
            currentTags = [];
            renderModalTags();
            natureModal.classList.add('active');
        }

        // Close main modal
        function closeNatureModal() {
            natureModal.classList.remove('active');
            editingNatureId = null;
            currentTags = [];
            natureNameInput.value = '';
            tagInput.value = '';
        }

        // Render tags in main modal
        function renderModalTags() {
            modalTagsContainer.innerHTML = '';
            currentTags.forEach(tag => {
                const tagElement = document.createElement('span');
                tagElement.className = 'type-tag';
                tagElement.innerHTML = `
                    ${tag}
                    <button class="remove-tag" data-tag="${tag}">&times;</button>
                `;
                modalTagsContainer.appendChild(tagElement);
            });

            // Add event listeners to remove buttons in modal
            modalTagsContainer.querySelectorAll('.remove-tag').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const tagToRemove = e.target.dataset.tag;
                    currentTags = currentTags.filter(tag => tag !== tagToRemove);
                    renderModalTags();
                });
            });
        }

        // Add tag in main modal
        function addTagFromModal() {
            const tag = tagInput.value.trim();
            if (tag && !currentTags.includes(tag)) {
                currentTags.push(tag);
                renderModalTags();
                tagInput.value = '';
            }
        }

        // Save nature in main modal
        async function saveNature() {
            const name = natureNameInput.value.trim();
            if (!name) {
                //alert('Please enter a name for the complaint nature');
                showNotification('Please enter a name for the complaint nature', 'error');
                return;
            }

            try {
                // Show loading state
                saveBtnText.style.display = 'none';
                saveBtnSpinner.style.display = 'inline';
                saveBtn.disabled = true;

                const natureData = {
                    name,
                    types: currentTags
                };

                if (editingNatureId) {
                    // Update existing nature
                    await updateNature(editingNatureId, natureData);
                } else {
                    // Add new nature
                    await createNature(natureData);
                }

                // Refresh data
                await fetchNatures();
                closeNatureModal();
            } catch (error) {
                console.error('Error saving nature:', error);
                showNotification('Failed to save nature. Please try again.', 'error');
                //alert(error.message || 'Failed to save nature. Please try again.');
            } finally {
                // Reset button state
                saveBtnText.style.display = 'inline';
                saveBtnSpinner.style.display = 'none';
                saveBtn.disabled = false;
            }
        }

        // Tag Modal Functions
        // Open tag modal for adding tags to existing nature
        function openTagModal(natureId) {
            editingTagNatureId = natureId;
            const nature = naturesData.find(n => n.id === natureId);
            
            if (nature) {
                tagModalTitle.textContent = 'Add Types to ';
                natureNameInModal.textContent = nature.name;
                currentTagInputs = [...nature.types];
                renderExistingTags();
                newTagInput.value = '';
                tagModal.classList.add('active');
            }
        }

        // Close tag modal
        function closeTagModalFunc() {
            tagModal.classList.remove('active');
            editingTagNatureId = null;
            currentTagInputs = [];
            newTagInput.value = '';
        }

        // Render existing tags in tag modal
        function renderExistingTags() {
            existingTagsContainer.innerHTML = '';
            if (currentTagInputs.length === 0) {
                existingTagsContainer.innerHTML = '<div style="color: var(--text-gray); font-size: 12px; font-style: italic;">No types added yet</div>';
            } else {
                currentTagInputs.forEach(tag => {
                    const tagElement = document.createElement('span');
                    tagElement.className = 'type-tag';
                    tagElement.innerHTML = `
                        ${tag}
                        <button class="remove-tag" data-tag="${tag}">&times;</button>
                    `;
                    existingTagsContainer.appendChild(tagElement);
                });

                // Add event listeners to remove buttons in tag modal
                existingTagsContainer.querySelectorAll('.remove-tag').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const tagToRemove = e.target.dataset.tag;
                        currentTagInputs = currentTagInputs.filter(tag => tag !== tagToRemove);
                        renderExistingTags();
                    });
                });
            }
        }

        // Add new tag in tag modal
        function addNewTagInModal() {
            const tag = newTagInput.value.trim();
            if (tag && !currentTagInputs.includes(tag)) {
                currentTagInputs.push(tag);
                renderExistingTags();
                newTagInput.value = '';
            }
        }

        // Save tags from tag modal
        async function saveTagsFromModal() {
            try {
                // Show loading state
                saveTagBtnText.style.display = 'none';
                saveTagBtnSpinner.style.display = 'inline';
                saveTagBtn.disabled = true;

                await updateNatureTypes(editingTagNatureId, currentTagInputs);
                
                // Refresh data
                await fetchNatures();
                closeTagModalFunc();
            } catch (error) {
                console.error('Error saving types:', error);
                showNotification('Failed to save types. Please try again.', 'error');
                //alert(error.message || 'Failed to save types. Please try again.');
            } finally {
                // Reset button state
                saveTagBtnText.style.display = 'inline';
                saveTagBtnSpinner.style.display = 'none';
                saveTagBtn.disabled = false;
            }
        }

        // Remove tag from nature (in table)
        async function removeTagFromNature(natureId, tagToRemove) {
            if (!confirm(`Are you sure you want to remove the type "${tagToRemove}"?`)) {
                return;
            }

            try {
                // First, find the nature
                const nature = naturesData.find(n => n.id === natureId);
                if (!nature) return;

                // Find the type index
                const typeIndex = nature.types.indexOf(tagToRemove);
                if (typeIndex === -1) return;

                // In a real implementation, you would need to know the type ID
                // Since we don't have it, we'll update all types for this nature
                const updatedTypes = nature.types.filter(type => type !== tagToRemove);
                await updateNatureTypes(natureId, updatedTypes);
                
                // Refresh data
                await fetchNatures();
            } catch (error) {
                console.error('Error removing type:', error);
                showNotification('Failed to remove type. Please try again.', 'error');
                //alert(error.message || 'Failed to remove type. Please try again.');
            }
        }

        // Event Listeners for Table
        searchBtn.addEventListener('click', searchNatures);
        
        // Also search on Enter key in search input
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchNatures();
            }
        });
        
        entriesPerPageSelect.addEventListener('change', changeEntriesPerPage);
        
        addNatureBtn.addEventListener('click', openAddModal);
        
        // Pagination event listeners
        prevPageBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        });
        
        nextPageBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        });
        
        // Delegated event handlers for table
        document.addEventListener('click', function(e) {
            // Edit button click
            if (e.target.closest('.edit-btn')) {
                const editBtn = e.target.closest('.edit-btn');
                const natureId = parseInt(editBtn.getAttribute('data-id'));
                openEditModal(natureId);
            }
            
            // Add tag button in table
            if (e.target.closest('.add-tag-btn')) {
                const addBtn = e.target.closest('.add-tag-btn');
                const natureId = parseInt(addBtn.getAttribute('data-nature-id'));
                openTagModal(natureId);
            }
            
            // Remove tag button in table
            if (e.target.closest('.remove-tag')) {
                const removeBtn = e.target.closest('.remove-tag');
                const natureId = parseInt(removeBtn.getAttribute('data-nature-id'));
                const tagType = removeBtn.getAttribute('data-type');
                removeTagFromNature(natureId, tagType);
            }
        });

        // Main Modal Event Listeners
        closeModal.addEventListener('click', closeNatureModal);
        cancelBtn.addEventListener('click', closeNatureModal);
        saveBtn.addEventListener('click', saveNature);
        addTagBtn.addEventListener('click', addTagFromModal);
        tagInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTagFromModal();
            }
        });

        // Tag Modal Event Listeners
        closeTagModal.addEventListener('click', closeTagModalFunc);
        cancelTagBtn.addEventListener('click', closeTagModalFunc);
        saveTagBtn.addEventListener('click', saveTagsFromModal);
        addNewTagBtn.addEventListener('click', addNewTagInModal);
        newTagInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addNewTagInModal();
            }
        });

        // Close modals when clicking outside
        natureModal.addEventListener('click', (e) => {
            if (e.target === natureModal) {
                closeNatureModal();
            }
        });

        tagModal.addEventListener('click', (e) => {
            if (e.target === tagModal) {
                closeTagModalFunc();
            }
        });

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            fetchNatures();
        });
    </script>
    <script>
    // Show notification - FIXED VERSION
    function showNotification(message, type = 'success') {
        // Remove existing notification if any
        const existingNotification = document.querySelector('.notification');
        if (existingNotification) {
            existingNotification.remove();
        }
        
        // Create notification element
        const notification = document.createElement('div');
        notification.className = `notification ${type}`;
        notification.innerHTML = `
            <div class="notification-content">
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
                <span>${message}</span>
            </div>
            <button class="notification-close">&times;</button>
        `;
        
        // Add to DOM
        document.body.appendChild(notification);
        
        // Auto-remove after 3 seconds
        const timeoutId = setTimeout(() => {
            if (notification.parentNode) {
                notification.remove();
            }
        }, 3000);
        
        // Close button event
        notification.querySelector('.notification-close').addEventListener('click', () => {
            clearTimeout(timeoutId);
            notification.remove();
        });
    }

    // Add notification styles to head
    if (!document.querySelector('#notification-styles')) {
        const style = document.createElement('style');
        style.id = 'notification-styles';
        style.textContent = `
            .notification {
                position: fixed;
                top: 80px;
                right: 20px;
                padding: 12px 16px;
                border-radius: 6px;
                color: white;
                font-size: 13px;
                z-index: 10000;
                display: flex;
                align-items: center;
                justify-content: space-between;
                min-width: 280px;
                max-width: 350px;
                box-shadow: 0 3px 10px rgba(0,0,0,0.2);
                animation: slideIn 0.3s ease-out;
                transform: translateX(0);
            }
            
            .notification-content {
                display: flex;
                align-items: center;
                gap: 10px;
                flex: 1;
            }
            
            .notification.success {
                background-color: #4CAF50;
                border-left: 4px solid #2E7D32;
            }
            
            .notification.error {
                background-color: #f44336;
                border-left: 4px solid #C62828;
            }
            
            .notification-close {
                background: none;
                border: none;
                color: white;
                font-size: 18px;
                cursor: pointer;
                padding: 0 0 0 10px;
                opacity: 0.8;
                line-height: 1;
            }
            
            .notification-close:hover {
                opacity: 1;
            }
            
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            
            @keyframes fadeOut {
                from {
                    opacity: 1;
                }
                to {
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    }
</script>
