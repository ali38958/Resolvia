<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>water drop login · bouncy morph</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #89c2d0 0%, #4f7a8c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            /* still water surface: subtle gradient, no animations */
        }

        /* ----- still water background with glassy reflections ----- */
        .water-surface {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 240, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 250, 0.2) 0%, transparent 45%),
                linear-gradient(125deg, #9dc3d1 0%, #588292 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* static water drops in background (just decoration, no animation) */
        .bg-drop {
            position: absolute;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 60% 40% 70% 30% / 40% 60% 40% 60%;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2), inset 0 0 30px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 0;
            pointer-events: none;
            backdrop-filter: blur(2px);
        }

        .bg-drop1 {
            width: 45vmax;
            height: 45vmax;
            left: -10vmax;
            top: -20vmax;
            transform: rotate(15deg);
        }

        .bg-drop2 {
            width: 30vmin;
            height: 40vmin;
            right: 8%;
            bottom: 5%;
            border-radius: 70% 30% 40% 60% / 30% 60% 40% 70%;
        }

        .bg-drop3 {
            width: 50vmin;
            height: 45vmin;
            left: 5%;
            bottom: -5%;
            border-radius: 40% 60% 30% 70% / 60% 30% 70% 40%;
            background: rgba(255, 255, 255, 0.05);
        }

        /* ---- main container: login placed on a giant static water drop ---- */
        .login-container {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
            transition: none;
            /* static until interaction */
        }

        /* The giant water drop that holds everything */
        .water-drop-card {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(18px) saturate(200%);
            -webkit-backdrop-filter: blur(18px) saturate(200%);
            /* static water drop shape (still) */
            border-radius: 70% 30% 60% 40% / 40% 60% 40% 60%;
            padding: 2.8rem 2.2rem 3rem 2.2rem;
            box-shadow: 0 30px 45px rgba(0, 20, 25, 0.35),
                0 0 0 2px rgba(255, 255, 255, 0.5) inset,
                0 0 50px rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.5s cubic-bezier(0.34, 1.6, 0.4, 1);
            /* bouncy transition (only on interaction) */
            transform: scale(1);
            /* no animation loop — completely static initially */
        }

        /* bouncy transitions are triggered by hover / focus within */
        .water-drop-card:hover,
        .water-drop-card:focus-within {
            border-radius: 55% 45% 50% 50% / 45% 55% 45% 55%;
            box-shadow: 0 40px 60px rgba(0, 35, 45, 0.4), 0 0 0 3px rgba(255, 255, 255, 0.8) inset, 0 0 70px rgba(255, 255, 240, 0.7);
            transform: scale(1.01) translateY(-4px);
            transition-duration: 0.6s;
        }

        /* title – like a water drop lettering */
        h2 {
            text-align: center;
            font-size: 2.6rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.98);
            text-shadow: 3px 5px 12px rgba(0, 30, 40, 0.4), 0 0 25px rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
            margin-bottom: 2rem;
            filter: drop-shadow(0 6px 4px rgba(0, 0, 0, 0.1));
            transform: rotate(-0.2deg);
            transition: transform 0.4s cubic-bezier(0.2, 1.2, 0.3, 1), text-shadow 0.3s;
        }

        .water-drop-card:hover h2,
        .water-drop-card:focus-within h2 {
            transform: scale(1.02) rotate(-0.5deg) translateY(-3px);
            text-shadow: 4px 8px 18px rgba(0, 50, 60, 0.5), 0 0 30px rgba(255, 255, 255, 0.9);
        }

        /* ----- each input group is a little water drop (static, bouncy on interaction) ----- */
        .input-group {
            margin-bottom: 2rem;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.25, 1.2, 0.35, 1);
        }

        .input-group:focus-within {
            transform: translateY(-3px) scale(1.01);
        }

        .input-group label {
            display: block;
            margin-bottom: 0.4rem;
            margin-left: 0.8rem;
            font-size: 1rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .input-group:focus-within label {
            transform: translateX(6px) scale(1.03);
            color: white;
            text-shadow: 0 0 12px white;
        }

        /* water drop shaped field */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.95);
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
            z-index: 3;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.2, 1.2, 0.3, 1);
        }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.22);
            border: 2px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            /* water drop shape (static) */
            border-radius: 60% 40% 50% 50% / 40% 50% 50% 60%;
            padding: 1rem 1rem 1rem 3.2rem;
            font-size: 1.1rem;
            color: #033544;
            font-weight: 600;
            outline: none;
            transition: all 0.5s cubic-bezier(0.22, 1.4, 0.35, 1);
            /* bouncy */
            box-shadow: 0 8px 16px rgba(0, 20, 25, 0.2), inset 3px 3px 20px rgba(255, 255, 255, 0.7);
        }

        /* interaction – bouncy blob deformation */
        .input-field:hover {
            background: rgba(255, 255, 255, 0.35);
            border-radius: 45% 55% 40% 60% / 55% 40% 60% 45%;
            transform: scale(1.02);
            border-color: white;
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 40% 60% 30% 70% / 60% 30% 70% 40%;
            /* more distorted */
            transform: scale(1.03) translateY(-2px);
            border-color: white;
            box-shadow: 0 12px 28px rgba(0, 45, 55, 0.3), inset 0 0 20px rgba(255, 255, 255, 1);
        }

        /* little water drop that appears near the field on focus (extra bounce) */
        .input-wrapper::after {
            content: '';
            position: absolute;
            top: -10px;
            right: -10px;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 70% 30% 60% 40% / 50% 60% 40% 50%;
            filter: blur(8px);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.3, 1.5, 0.4, 1);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 2;
        }

        .input-wrapper:focus-within::after {
            opacity: 1;
            transform: translate(6px, -8px) scale(1.3);
        }

        /* remember & forgot row */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.8rem 0 2.3rem;
            color: rgba(255, 255, 255, 0.95);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .remember input {
            width: 20px;
            height: 20px;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50% 40% 50% 50% / 40% 50% 50% 60%;
            border: 2px solid rgba(255, 255, 255, 0.9);
            transition: all 0.3s cubic-bezier(0.3, 1.3, 0.4, 1);
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }

        .remember input:checked {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 40% 60% 30% 70% / 60% 30% 70% 40%;
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 22px white;
        }

        .forgot-link {
            color: white;
            text-decoration: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.8);
            padding-bottom: 2px;
            transition: all 0.3s cubic-bezier(0.2, 1.2, 0.3, 1);
        }

        .forgot-link:hover {
            border-bottom-style: solid;
            transform: translateY(-2px) scale(1.02);
            text-shadow: 0 0 18px white;
            border-bottom-color: white;
        }

        /* ——— main action button: giant water drop ——— */
        .login-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(18px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 70% 30% 60% 40% / 40% 60% 40% 60%;
            padding: 1.1rem;
            font-size: 1.9rem;
            font-weight: 350;
            color: white;
            text-shadow: 3px 5px 12px rgba(0, 30, 35, 0.3);
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 15px 30px rgba(0, 20, 25, 0.3), 0 0 40px rgba(255, 255, 240, 0.5);
            transition: all 0.5s cubic-bezier(0.25, 1.6, 0.4, 1);
            /* strong bounce */
            margin-bottom: 1.8rem;
            line-height: 1.2;
        }

        .login-btn:hover {
            background: rgba(255, 255, 255, 0.55);
            border-radius: 50% 50% 30% 70% / 60% 30% 70% 40%;
            transform: scale(1.03) translateY(-6px);
            box-shadow: 0 30px 45px rgba(0, 40, 50, 0.4), 0 0 70px rgba(255, 255, 255, 0.9);
            border-color: white;
            letter-spacing: 4px;
        }

        .login-btn:active {
            transform: scale(0.96) translateY(4px);
            border-radius: 80% 20% 70% 30% / 30% 70% 30% 70%;
            transition: all 0.15s;
            /* quick squish */
        }

        /* signup link */
        .signup-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.1rem;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .signup-text a {
            color: white;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s cubic-bezier(0.2, 1.2, 0.3, 1);
            display: inline-block;
        }

        .signup-text a:hover {
            transform: translateY(-3px) scale(1.05);
            border-bottom-color: white;
            filter: drop-shadow(0 0 14px white);
        }

        /* small bouncy drop under the card (still bg) */
        .static-underlay {
            position: absolute;
            bottom: -30px;
            left: 10%;
            width: 200px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 60% 40% 50% 50% / 30% 60% 40% 70%;
            filter: blur(20px);
            z-index: 1;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* no keyframe animations — everything reacts only to interaction */
    </style>
</head>

<body>
    <!-- static water background (no animation) -->
    <div class="water-surface"></div>
    <div class="bg-drop bg-drop1"></div>
    <div class="bg-drop bg-drop2"></div>
    <div class="bg-drop bg-drop3"></div>
    <div class="static-underlay"></div>

    <!-- main login card – static giant water drop -->
    <div class="login-container">
        <div class="water-drop-card">
            <h2>⏤ ⏤  ˗ˋ˖ drop ˖ˊ˗  ⏤ ⏤</h2>

            <!-- username drop -->
            <div class="input-group">
                <label>💧 username / email</label>
                <div class="input-wrapper">
                    <span class="input-icon">🌊</span>
                    <input class="input-field" type="text" placeholder="your droplet...">
                </div>
            </div>

            <!-- password drop -->
            <div class="input-group">
                <label>💧 password</label>
                <div class="input-wrapper">
                    <span class="input-icon">⚬</span>
                    <input class="input-field" type="password" placeholder="••••••••">
                </div>
            </div>

            <!-- options with bouncy checkbox / link -->
            <div class="options">
                <label class="remember">
                    <input type="checkbox" checked> <span>hold this drop</span>
                </label>
                <a href="#" class="forgot-link">drift away?</a>
            </div>

            <!-- giant bouncy water button -->
            <button class="login-btn"> enter</button>

            <!-- signup -->
            <div class="signup-text">
                new droplet? <a href="#">merge here</a>
            </div>
        </div>
    </div>

    <!-- tiny script: optional but we can add a bit more bounce via class toggles? 
       pure CSS covers all, but we want hover/unhover transitions only. 
       everything already bouncy with cubic-bezier -->
</body>

</html>
