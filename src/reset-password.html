<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolvia - Reset Password</title>
    <link rel="icon" type="image/png" href="/assets/logo_nobg.png">

    <link rel="preload" as="image" href="assets/building.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --nutech-green: rgba(8, 81, 68, 0.94);
            --nutech-solid: #085144;
            --text-white: #ffffff;
            --fallback-bg: #042a23;
            --label-color: #085144;
            --success: #4CAF50;
            --error: #F44336;
            --warning: #ffc107;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            background: var(--fallback-bg) url('assets/building.jpg') no-repeat center center/cover;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        .main-container {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        /* --- Panels --- */
        .form-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 3;
            background: transparent;
        }

        .info-panel {
            position: relative;
            width: 50%;
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            text-align: center;
            padding: 20px;
        }

        /* --- Wave Animation --- */
        .wave-image {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: auto;
            min-width: 100%;
            object-fit: cover;
            pointer-events: none;
            z-index: 1;
            opacity: 0.7;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.1));
            animation: waveInFromRight 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes waveInFromRight {
            from {
                transform: translateX(150%);
            }

            to {
                transform: translateX(0);
            }
        }

        @keyframes waveOutRight {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(150%);
            }
        }

        .wave-exit-right {
            animation: waveOutRight 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
        }

        /* --- Branding --- */
        .content-wrapper {
            max-width: 400px;
            position: relative;
            z-index: 5;
        }

        .logo-circle {
            width: clamp(120px, 15vw, 180px);
            height: clamp(120px, 15vw, 180px);
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            animation: floatLogo 6s ease-in-out infinite;
            margin-bottom: 25px;
        }

        .info-panel h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .info-panel h2 {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 400;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        @keyframes floatLogo {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        /* --- Glass Card --- */
        .glass-card {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: clamp(20px, 5vw, 40px);
            border-radius: 28px;
            width: 100%;
            max-width: 450px;
            color: white;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.3s ease, opacity 0.5s ease, transform 0.5s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .glass-card:hover {
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .glass-card h2 {
            font-size: 2rem;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 600;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            color: white;
        }

        .glass-card p {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 25px;
            text-align: center;
            font-size: 0.95rem;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .card-fade-out {
            opacity: 0;
            transform: scale(0.95);
        }

        /* --- Floating Labels --- */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group i {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            z-index: 2;
            transition: color 0.3s ease;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .input-group input {
            width: 100%;
            padding: 16px 0 8px 30px;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            background: transparent;
            font-size: 1rem;
            color: white;
            outline: none;
            transition: border-color 0.3s ease;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .input-group input:focus {
            border-bottom-color: white;
            border-bottom-width: 3px;
        }

        .input-group input:focus+label,
        .input-group input:not(:placeholder-shown)+label {
            transform: translateY(-30px) scale(0.85);
            color: white;
            left: 30px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .input-group input:focus~i {
            color: white;
            transform: translateY(-50%) scale(1.1);
        }

        .input-group label {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
            transition: all 0.2s ease-out;
            font-size: 1rem;
            transform-origin: left top;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .input-group input::placeholder {
            color: transparent;
        }

        /* --- Validation Messages --- */
        .validation-message {
            font-size: 0.8rem;
            margin-top: 5px;
            padding: 5px 10px;
            border-radius: 20px;
            display: none;
            font-weight: 500;
        }

        .validation-message.valid {
            display: block;
            color: var(--success);
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .validation-message.invalid {
            display: block;
            color: #ff8a80;
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        /* --- OTP Button --- */
        .btn-otp {
            width: 100%;
            padding: 16px;
            border-radius: 40px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            position: relative;
        }

        .btn-otp:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-otp:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-otp:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-otp.loading {
            color: transparent;
        }

        .btn-otp.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin: -10px 0 0 -10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        /* --- Buttons --- */
        .btn-primary,
        .btn-secondary {
            width: 100%;
            padding: 16px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: white;
            color: var(--nutech-solid);
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }

        /* --- OTP Timer --- */
        .otp-timer {
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: none;
            font-weight: 500;
        }

        .otp-timer.show {
            display: block;
        }

        .otp-timer span {
            color: white;
            font-weight: 600;
        }

        /* --- Checkbox Style --- */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            cursor: pointer;
            color: white;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .checkbox-label input[type="checkbox"] {
            accent-color: white;
            width: 18px;
            height: 18px;
            background: transparent;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* --- Back to Login Link --- */
        .back-to-login {
            text-align: center;
            margin-top: 20px;
        }

        .back-to-login a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .back-to-login a:hover {
            background: rgba(255, 255, 255, 0.2);
            gap: 12px;
            border-color: rgba(255, 255, 255, 0.4);
            color: white;
        }

        .back-to-login i {
            font-size: 1rem;
        }

        /* --- Notification Container --- */
        #notificationContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
        }

        .notification {
            padding: 15px 20px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            padding-right: 40px;
        }

        .notification.success {
            background: rgba(76, 175, 80, 0.95);
        }

        .notification.error {
            background: rgba(244, 67, 54, 0.95);
        }

        .notification.info {
            background: rgba(33, 150, 243, 0.95);
        }

        .notification.warning {
            background: rgba(255, 193, 7, 0.95);
            color: #333;
        }

        .notification .close-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: inherit;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 0 5px;
        }

        .notification .close-btn:hover {
            opacity: 1;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }

            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* --- Loading Spinner for primary button --- */
        .btn-primary:disabled {
            position: relative;
            color: transparent;
        }

        .btn-primary:disabled::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid rgba(8, 81, 68, 0.2);
            border-top-color: var(--nutech-solid);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        /* --- Scrollbar Styling --- */
        .glass-card::-webkit-scrollbar {
            width: 8px;
        }

        .glass-card::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .glass-card::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .glass-card::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* --- RESPONSIVENESS --- */
        @media (max-width: 1024px) {
            .info-panel {
                width: 45%;
            }
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                overflow-y: auto;
            }

            .info-panel {
                width: 100%;
                padding: 60px 20px 40px 20px;
                min-height: auto;
                background-color: var(--nutech-green);
                order: -1;
            }

            .wave-image {
                display: none;
            }

            .form-panel {
                width: 100%;
                padding: 20px;
                background: transparent;
            }

            .glass-card {
                max-width: 100%;
                max-height: none;
                overflow-y: visible;
                backdrop-filter: blur(15px);
            }
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 25px 15px;
                border-radius: 24px;
            }

            .glass-card h2 {
                font-size: 1.6rem;
                margin-bottom: 20px;
            }

            .glass-card p {
                font-size: 0.85rem;
                margin-bottom: 20px;
            }

            .input-group {
                margin-bottom: 20px;
            }

            .input-group input {
                padding: 14px 0 6px 28px;
                font-size: 0.95rem;
            }

            .input-group label {
                left: 28px;
                font-size: 0.95rem;
            }

            .input-group i {
                font-size: 1rem;
            }

            .input-group input:focus+label,
            .input-group input:not(:placeholder-shown)+label {
                transform: translateY(-26px) scale(0.85);
                left: 28px;
            }

            .btn-otp,
            .btn-primary {
                padding: 14px;
                font-size: 0.95rem;
            }

            .logo-circle {
                margin-bottom: 15px;
            }

            .checkbox-label {
                font-size: 0.85rem;
                margin-bottom: 15px;
            }

            .otp-timer {
                font-size: 0.8rem;
                padding: 8px;
            }

            .back-to-login a {
                font-size: 0.85rem;
                padding: 6px 14px;
            }

            .validation-message {
                font-size: 0.7rem;
            }
        }

        @media (max-width: 360px) {
            .glass-card {
                padding: 20px 12px;
            }

            .glass-card h2 {
                font-size: 1.4rem;
            }

            .input-group input {
                padding: 12px 0 5px 25px;
                font-size: 0.85rem;
            }

            .input-group label {
                left: 25px;
                font-size: 0.85rem;
            }

            .input-group input:focus+label,
            .input-group input:not(:placeholder-shown)+label {
                transform: translateY(-24px) scale(0.85);
                left: 25px;
            }

            .btn-otp,
            .btn-primary {
                padding: 12px;
                font-size: 0.85rem;
            }
        }

        @media (max-height: 600px) and (orientation: landscape) {
            .info-panel {
                padding: 20px;
            }

            .logo-circle {
                width: 80px;
                height: 80px;
                margin-bottom: 10px;
            }

            .glass-card {
                padding: 20px;
            }

            .input-group {
                margin-bottom: 15px;
            }
        }
    </style>
</head>

<body>
    <!-- Notification Container -->
    <div id="notificationContainer"></div>

    <div class="main-container">
        <div class="form-panel">
            <div class="glass-card" id="resetPasswordCard">
                <form id="resetPasswordForm">
                    <h2 style="font-size: 2rem; margin-bottom: 30px; text-align: center; color: var(--text-white);">
                        Reset Password</h2>

                    <p
                        style="color: rgba(255, 255, 255, 0.8); margin-bottom: 25px; text-align: center; font-size: 0.95rem;">
                        Enter your email address to receive an OTP and reset your password.
                    </p>

                    <div class="input-group">
                        <input type="email" id="email" placeholder=" " required />
                        <label for="email">Email Address</label>
                        <i class="fas fa-envelope"></i>
                        <div id="emailValidation" class="validation-message"></div>
                    </div>

                    <button type="button" id="sendOtpBtn" class="btn-otp">
                        <span id="otpText">Send OTP</span>
                    </button>

                    <div class="otp-timer" id="otpTimer">
                        Resend OTP in <span id="timer">60</span> seconds
                    </div>

                    <div class="input-group">
                        <input type="text" id="otpCode" placeholder=" " maxlength="6" pattern="[0-9]{6}"
                            title="6-digit OTP" />
                        <label for="otpCode">Email Confirmation Code</label>
                        <i class="fas fa-key"></i>
                    </div>

                    <div class="input-group">
                        <input type="password" class="password-field" id="newPassword" placeholder=" " required
                            minlength="8" />
                        <label for="newPassword">New Password</label>
                        <i class="fas fa-lock"></i>
                    </div>

                    <div class="input-group">
                        <input type="password" class="password-field" id="confirmPassword" placeholder=" " required />
                        <label for="confirmPassword">Confirm New Password</label>
                        <i class="fas fa-lock"></i>
                    </div>

                    <label
                        style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-size: 0.9rem; cursor: pointer; color: white;">
                        <input type="checkbox" id="showPassword" style="accent-color: var(--nutech-solid);"> Show
                        Passwords
                    </label>

                    <button type="submit" id="resetPasswordBtn" class="btn-primary">
                        Reset Password
                    </button>

                    <div class="back-to-login">
                        <a href="login.html" id="toLogin">
                            <i class="fas fa-arrow-left"></i> Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <div class="info-panel">
            <img src="assets/wave2.svg" alt="" class="wave-image" id="wave">
            <div class="content-wrapper">
                <img src="assets/logo.png" alt="Logo" class="logo-circle" />
                <h1>Resolvia</h1>
                <h2>Complaint Management System</h2>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        let OTP_CONFIG = {
            otpLifeMinutes: 5,
            otpResendCooldownSeconds: 60,
            otpLength: 6
        };

        // State
        let otpTimerInterval = null;
        let canResendOTP = true;
        let emailExists = false;

        // Load OTP Configuration
        async function loadOTPConfig() {
            try {
                const response = await fetch('/api/otp-config');
                const result = await response.json();

                if (result.success) {
                    OTP_CONFIG = result.config;
                    console.log('OTP Configuration loaded:', OTP_CONFIG);
                }
            } catch (error) {
                console.error('Failed to load OTP config:', error);
            }
        }

        // Notification System
        function showNotification(message, type = 'info', duration = 5000) {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                ${message}
                <button class="close-btn">&times;</button>
            `;

            container.appendChild(notification);

            setTimeout(() => notification.classList.add('show'), 10);

            notification.querySelector('.close-btn').addEventListener('click', () => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            });

            if (duration > 0) {
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.classList.remove('show');
                        setTimeout(() => notification.remove(), 300);
                    }
                }, duration);
            }
        }

        // OTP Timer Functions
        function startOTPTimer(seconds = OTP_CONFIG.otpResendCooldownSeconds) {
            clearOTPTimer();

            const timerElement = document.getElementById('timer');
            const otpTimer = document.getElementById('otpTimer');
            const sendOtpBtn = document.getElementById('sendOtpBtn');

            let timeLeft = seconds;
            canResendOTP = false;
            sendOtpBtn.disabled = true;
            otpTimer.classList.add('show');

            otpTimerInterval = setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearOTPTimer();
                    canResendOTP = true;
                    sendOtpBtn.disabled = false;
                    otpTimer.classList.remove('show');
                    document.getElementById('otpText').textContent = 'Send OTP';
                }
            }, 1000);
        }

        function clearOTPTimer() {
            if (otpTimerInterval) {
                clearInterval(otpTimerInterval);
                otpTimerInterval = null;
            }
        }

        // Validate Email
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Check Email Existence
        async function checkEmailExists(email) {
            try {
                const response = await fetch('/api/check-email-exists', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                });

                const result = await response.json();
                return result;
            } catch (error) {
                console.error('Check email error:', error);
                return { exists: false, message: 'Failed to check email' };
            }
        }

        // Update Email Validation Display
        function updateEmailValidation(message, isValid) {
            const validationElement = document.getElementById('emailValidation');
            validationElement.textContent = message;
            validationElement.className = `validation-message ${isValid ? 'valid' : 'invalid'}`;
            emailExists = isValid;
        }

        // Send OTP Function
        async function sendOTP() {
            const email = document.getElementById('email').value.trim();
            const sendOtpBtn = document.getElementById('sendOtpBtn');

            // Validate email
            if (!email) {
                showNotification('Please enter your email address', 'error');
                return;
            }

            if (!isValidEmail(email)) {
                showNotification('Please enter a valid email address', 'error');
                return;
            }

            // Check if email exists in the system
            const checkResult = await checkEmailExists(email);
            if (!checkResult.exists) {
                showNotification('Email not found in our system', 'error');
                updateEmailValidation('Email not registered', false);
                return;
            }

            updateEmailValidation('Email verified', true);

            // Disable button and show loading
            sendOtpBtn.disabled = true;
            sendOtpBtn.classList.add('loading');

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'send-otp',
                        email: email
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showNotification(result.message, 'success');
                    startOTPTimer(OTP_CONFIG.otpResendCooldownSeconds);
                    document.getElementById('otpCode').focus();
                } else {
                    showNotification(result.message, 'error');

                    if (result.message.includes('wait')) {
                        const waitMatch = result.message.match(/(\d+)\s+seconds/);
                        if (waitMatch && waitMatch[1]) {
                            startOTPTimer(parseInt(waitMatch[1]));
                        }
                    } else {
                        sendOtpBtn.disabled = false;
                    }
                }
            } catch (error) {
                console.error('Send OTP error:', error);
                showNotification('Failed to send OTP. Please check your connection and try again.', 'error');
                sendOtpBtn.disabled = false;
            } finally {
                sendOtpBtn.classList.remove('loading');
            }
        }

        // Reset Password Function
        async function handleResetPassword(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const otpCode = document.getElementById('otpCode').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resetPasswordBtn = document.getElementById('resetPasswordBtn');

            // Validate form
            if (!email || !otpCode || !newPassword || !confirmPassword) {
                showNotification('Please fill in all fields', 'error');
                return;
            }

            if (!emailExists) {
                showNotification('Please verify your email first', 'error');
                return;
            }

            if (!isValidEmail(email)) {
                showNotification('Please enter a valid email address', 'error');
                return;
            }

            if (otpCode.length !== OTP_CONFIG.otpLength) {
                showNotification(`OTP must be ${OTP_CONFIG.otpLength} digits`, 'error');
                return;
            }

            if (newPassword.length < 8) {
                showNotification('Password must be at least 8 characters long', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showNotification('Passwords do not match', 'error');
                return;
            }

            // Disable button and show loading
            resetPasswordBtn.disabled = true;
            resetPasswordBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting Password...';

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'reset-password',
                        email: email,
                        otpCode: otpCode,
                        newPassword: newPassword,
                        confirmPassword: confirmPassword
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showNotification(result.message, 'success');

                    // Clear form
                    document.getElementById('resetPasswordForm').reset();
                    clearOTPTimer();

                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showNotification(result.message, 'error');
                    resetPasswordBtn.disabled = false;
                    resetPasswordBtn.textContent = 'Reset Password';
                }
            } catch (error) {
                console.error('Reset password error:', error);
                showNotification('Failed to reset password. Please try again.', 'error');
                resetPasswordBtn.disabled = false;
                resetPasswordBtn.textContent = 'Reset Password';
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function () {
            // Load OTP configuration
            loadOTPConfig();

            // Password Toggle
            document.getElementById('showPassword').addEventListener('change', function () {
                const passwordFields = document.querySelectorAll('.password-field');
                passwordFields.forEach(field => {
                    field.type = this.checked ? 'text' : 'password';
                });
            });

            // Email validation (real-time)
            document.getElementById('email').addEventListener('input', async function () {
                const email = this.value.trim();
                if (isValidEmail(email)) {
                    const result = await checkEmailExists(email);
                    updateEmailValidation(result.message || '', result.exists);
                } else {
                    updateEmailValidation('Please enter a valid email', false);
                    emailExists = false;
                }
            });

            // Send OTP Button
            document.getElementById('sendOtpBtn').addEventListener('click', sendOTP);

            // Form Submission
            document.getElementById('resetPasswordForm').addEventListener('submit', handleResetPassword);

            // OTP Input - Auto validation
            document.getElementById('otpCode').addEventListener('input', function (e) {
                this.value = this.value.replace(/[^0-9]/g, '').slice(0, OTP_CONFIG.otpLength);
            });

            // Email input - Enable/disable OTP button
            document.getElementById('email').addEventListener('input', function () {
                const email = this.value.trim();
                const sendOtpBtn = document.getElementById('sendOtpBtn');
                sendOtpBtn.disabled = !isValidEmail(email);
            });

            // Page Transition
            document.getElementById('toLogin').addEventListener('click', function (e) {
                e.preventDefault();
                const target = this.href;
                const wave = document.getElementById('wave');

                if (wave && window.innerWidth > 900) {
                    wave.classList.add('wave-exit-right');
                }

                document.getElementById('resetPasswordCard').classList.add('card-fade-out');

                setTimeout(() => {
                    window.location.href = target;
                }, 500);
            });

            // Clear timer on page unload
            window.addEventListener('beforeunload', clearOTPTimer);
        });
    </script>
</body>

</html>
