<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="icon" type="image/png" href="/assets/logo_nobg.png">
    <title>Handler Profile — Resolvia</title>
    <link rel="stylesheet" href="/public/styles/common-styles.css">
    <style>
        /* ── Page-specific styles only ── */

        /* Profile hero banner */
        .profile-hero {
            background: linear-gradient(135deg, var(--primary) 0%, #072e26 100%);
            border-radius: var(--radius-xl);
            padding: var(--space-8) var(--space-8);
            display: flex;
            align-items: center;
            gap: var(--space-6);
            margin-bottom: var(--space-6);
            position: relative;
            overflow: hidden;
        }

        .profile-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='20'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
        }

        @media (max-width: 640px) {
            .profile-hero {
                flex-direction: column;
                text-align: center;
                padding: var(--space-6) var(--space-5);
            }
        }

        /* Avatar */
        .avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: var(--radius-full);
            border: 4px solid rgba(255, 255, 255, 0.25);
            object-fit: cover;
            background: rgba(255, 255, 255, 0.1);
            display: block;
            transition: opacity var(--t-fast);
        }

        .avatar-upload-btn {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 34px;
            height: 34px;
            border-radius: var(--radius-full);
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid #fff;
            font-size: 13px;
            transition: transform var(--t-fast), background var(--t-fast);
            z-index: 1;
        }

        .avatar-upload-btn:hover {
            transform: scale(1.1);
            background: var(--accent-hover);
        }

        /* Hero text */
        .hero-info {
            flex: 1;
            min-width: 0;
        }

        .hero-name {
            font-size: var(--text-3xl);
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: var(--space-2);
            line-height: 1.2;
        }

        .hero-meta {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            flex-wrap: wrap;
        }

        @media (max-width: 640px) {
            .hero-meta {
                justify-content: center;
            }
        }

        .hero-role {
            font-size: var(--text-sm);
            color: rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .hero-status {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            padding: 4px var(--space-3);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.03em;
        }

        .hero-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.3);
        }

        /* Profile content cards */
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-4);
        }

        @media (max-width: 768px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Profile field card */
        .profile-field {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
            transition: border-color var(--t-fast), box-shadow var(--t-fast), background-color var(--t-base);
        }

        .profile-field:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-sm);
        }

        .field-label {
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-bottom: var(--space-3);
        }

        .field-label i {
            color: var(--primary);
            width: 14px;
            text-align: center;
        }

        .field-value {
            font-size: var(--text-md);
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-3);
            min-height: 28px;
        }

        /* Static value (non-editable) */
        .field-static {
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            background: var(--bg-surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: var(--space-1) var(--space-3);
            display: inline-block;
        }

        /* Editable row */
        .editable-row {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            flex: 1;
        }

        .editable-text {
            flex: 1;
            color: var(--text-primary);
            font-size: var(--text-sm);
        }

        .field-edit-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-surface-2);
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: all var(--t-fast);
            flex-shrink: 0;
        }

        .field-edit-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary-mid);
            color: var(--primary);
        }

        /* Edit mode */
        .edit-row {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            flex: 1;
        }

        .edit-row .form-control {
            flex: 1;
            height: 36px;
        }

        .edit-save-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 0 var(--space-3);
            height: 32px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--primary);
            color: #fff;
            font-size: var(--text-xs);
            font-weight: 600;
            cursor: pointer;
            transition: background var(--t-fast), transform var(--t-fast);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .edit-save-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .edit-save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .edit-cancel-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-strong);
            background: var(--bg-surface);
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            transition: all var(--t-fast);
            flex-shrink: 0;
        }

        .edit-cancel-btn:hover {
            background: var(--danger-light);
            color: var(--danger);
            border-color: var(--danger);
        }

        /* Password field */
        .password-dots {
            font-size: 20px;
            letter-spacing: 4px;
            color: var(--text-muted);
            line-height: 1;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: calc(var(--header-height) + var(--space-4));
            right: var(--space-5);
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: 500;
            z-index: 5000;
            box-shadow: var(--shadow-lg);
            min-width: 260px;
            max-width: 380px;
            animation: toast-in 0.25s ease;
            border-left: 4px solid transparent;
        }

        @keyframes toast-in {
            from {
                transform: translateX(110%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.success {
            background: var(--success-light);
            border-color: var(--success);
            color: #166534;
        }

        .toast.error {
            background: var(--danger-light);
            border-color: var(--danger);
            color: #9f1239;
        }

        .toast.info {
            background: var(--info-light);
            border-color: var(--info);
            color: #1e40af;
        }

        .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            cursor: pointer;
            color: inherit;
            opacity: 0.6;
            font-size: 14px;
            padding: 0;
            line-height: 1;
            flex-shrink: 0;
        }

        .toast-close:hover {
            opacity: 1;
        }

        /* Skeleton loading */
        .skeleton-line {
            height: 18px;
            width: 60%;
            border-radius: var(--radius-sm);
        }
    </style>
</head>

<body>
    <header>
        <div class="header-left">
            <i class="fa fa-bars" id="menu-control"></i>
            <img src="/assets/logo.png" alt="Resolvia" id="logo">
            <span class="logo-text">Resolvia</span>
        </div>
        <div class="header-right">
            <button id="theme-toggle" title="Toggle theme">
                <i class="fa fa-moon icon-moon"></i>
                <i class="fa fa-sun icon-sun"></i>
            </button>
            <div class="profile-icon"><i class="fa fa-user"></i></div>
            <button class="logout-btn" id="logout-btn">
                <i class="fa fa-sign-out-alt"></i>
                <span>Logout</span>
            </button>
        </div>
    </header>

    <nav class="navigation-menu" id="navigation-menu">
        <ul id="nav-list"></ul>
    </nav>

    <main class="main-content" id="main-content">

        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1 class="page-title">My Profile</h1>
                <p class="page-subtitle">Manage your account information and preferences</p>
            </div>
        </div>

        <!-- Hero Banner -->
        <div class="profile-hero">
            <div class="avatar-wrap">
                <img src="/assets/default%20user%20icon.png" alt="Profile" class="profile-avatar" id="profileImage"
                    onerror="this.src='/assets/default%20user%20icon.png';">
                <label for="avatarInput" class="avatar-upload-btn" title="Change Photo">
                    <i class="fas fa-camera"></i>
                </label>
                <input type="file" id="avatarInput" accept="image/*" style="display:none;">
            </div>
            <div class="hero-info">
                <div class="hero-name" id="displayFullName">
                    <span class="skeleton skeleton-title" style="width:200px;height:28px;display:inline-block;"></span>
                </div>
                <div class="hero-meta">
                    <span class="hero-role">
                        <i class="fas fa-tools"></i>
                        <span id="displayDesignation">Complaint Receiver</span>
                    </span>
                    <span class="hero-status">
                        <span class="hero-status-dot"></span>
                        <span id="statusText">Active</span>
                    </span>
                </div>
            </div>
        </div>

        <!-- Profile Fields Grid -->
        <div class="profile-grid" id="profileGrid">

            <!-- Handler ID — static -->
            <div class="profile-field">
                <div class="field-label"><i class="fas fa-id-badge"></i> Handler ID</div>
                <div class="field-value">
                    <span class="field-static" id="displayHandlerId">
                        <span class="skeleton skeleton-text" style="width:80px;display:inline-block;"></span>
                    </span>
                </div>
            </div>

            <!-- Name — editable -->
            <div class="profile-field">
                <div class="field-label"><i class="fas fa-user"></i> Full Name</div>
                <div class="field-value" id="nameFieldValue">
                    <div class="editable-row" id="nameContainer">
                        <span class="editable-text" id="displayName">
                            <span class="skeleton skeleton-text" style="width:120px;display:inline-block;"></span>
                        </span>
                        <button class="field-edit-btn" onclick="enableEdit('name')" title="Edit Name">
                            <i class="fas fa-pen"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Email — editable -->
            <div class="profile-field">
                <div class="field-label"><i class="fas fa-envelope"></i> Email Address</div>
                <div class="field-value" id="emailFieldValue">
                    <div class="editable-row" id="emailContainer">
                        <span class="editable-text" id="displayEmail">
                            <span class="skeleton skeleton-text" style="width:160px;display:inline-block;"></span>
                        </span>
                        <button class="field-edit-btn" onclick="enableEdit('email')" title="Edit Email">
                            <i class="fas fa-pen"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Phone — editable -->
            <div class="profile-field">
                <div class="field-label"><i class="fas fa-phone"></i> Phone Number</div>
                <div class="field-value" id="phone_numberFieldValue">
                    <div class="editable-row" id="phone_numberContainer">
                        <span class="editable-text" id="displayPhone_number">
                            <span class="skeleton skeleton-text" style="width:100px;display:inline-block;"></span>
                        </span>
                        <button class="field-edit-btn" onclick="enableEdit('phone_number')" title="Edit Phone">
                            <i class="fas fa-pen"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Member Since — static -->
            <div class="profile-field">
                <div class="field-label"><i class="fas fa-calendar-alt"></i> Member Since</div>
                <div class="field-value">
                    <span class="text-secondary" id="displayJoinDate">
                        <span class="skeleton skeleton-text" style="width:100px;display:inline-block;"></span>
                    </span>
                </div>
            </div>

            <!-- Password — action -->
            <div class="profile-field">
                <div class="field-label"><i class="fas fa-lock"></i> Password</div>
                <div class="field-value" style="justify-content:space-between;">
                    <span class="password-dots">••••••••</span>
                    <button class="btn btn-secondary btn-sm" onclick="openPasswordModal()">
                        <i class="fas fa-key"></i> Change Password
                    </button>
                </div>
            </div>

        </div>

    </main>

    <!-- ── Password Modal ── -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal" style="max-width:420px;">
            <div class="modal-header">
                <h2 class="modal-title">Change Password</h2>
                <button class="modal-close" id="closePasswordModal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Current Password <span class="form-required">*</span></label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="currentPass" class="form-control"
                            placeholder="Enter current password">
                    </div>
                    <span class="form-error" id="currentPassError" style="display:none;">
                        <i class="fas fa-circle-exclamation"></i> <span></span>
                    </span>
                </div>
                <div class="form-group">
                    <label class="form-label">New Password <span class="form-required">*</span></label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="newPass" class="form-control" placeholder="Min. 6 characters">
                    </div>
                    <span class="form-error" id="newPassError" style="display:none;">
                        <i class="fas fa-circle-exclamation"></i> <span></span>
                    </span>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm New Password <span class="form-required">*</span></label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="confirmPass" class="form-control" placeholder="Repeat new password">
                    </div>
                    <span class="form-error" id="confirmPassError" style="display:none;">
                        <i class="fas fa-circle-exclamation"></i> <span></span>
                    </span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelPasswordBtn">Cancel</button>
                <button class="btn btn-primary" id="savePasswordBtn">
                    <i class="fas fa-save"></i> Update Password
                </button>
            </div>
        </div>
    </div>

    <script src="/js/axios.min.js"></script>
    <script src="/public/js/api.js"></script>
    <script src="/public/js/common-script.js"></script>
    <script>
        let handlerData = {
            id: '', name: '', email: '',
            phone_number: '', picture: '/assets/default%20user%20icon.png', created_at: ''
        };
        let originalValues = { name: '', email: '', phone_number: '' };

        // ── Toast ──
        function showToast(message, type = 'success') {
            document.querySelectorAll('.toast').forEach(t => t.remove());
            const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.success}"></i>
                <span style="flex:1">${message}</span>
                <button class="toast-close"><i class="fas fa-times"></i></button>
            `;
            document.body.appendChild(toast);
            toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
            setTimeout(() => toast?.remove(), 4000);
        }

        // ── Init ──
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data: authData } = await api.get('/api/auth/verify');
                handlerData.id = authData.user.id;
                handlerData.email = authData.user.email;
                handlerData.name = authData.user.name || 'Handler';
                if (authData.user.picture) handlerData.picture = authData.user.picture;
                await loadFullProfile();
            } catch (err) {
                console.error(err);
                if (err.response?.status === 401) window.location.href = '/login';
            }

            document.getElementById('avatarInput').addEventListener('change', handleImageUpload);

            // Modal controls
            document.getElementById('closePasswordModal').addEventListener('click', closePasswordModal);
            document.getElementById('cancelPasswordBtn').addEventListener('click', closePasswordModal);
            document.getElementById('passwordModal').addEventListener('click', e => {
                if (e.target === document.getElementById('passwordModal')) closePasswordModal();
            });
            document.getElementById('savePasswordBtn').addEventListener('click', updatePassword);
        });

        async function loadFullProfile() {
            try {
                const { data } = await api.get('/api/handler/profile');
                if (data.success) {
                    handlerData = { ...handlerData, ...data.data };
                    renderProfile();
                }
            } catch (err) {
                console.error(err);
                showToast('Failed to load profile data', 'error');
            }
        }

        function renderProfile() {
            document.getElementById('displayHandlerId').textContent = handlerData.id;
            document.getElementById('displayFullName').textContent = handlerData.name;
            document.getElementById('displayName').textContent = handlerData.name;
            document.getElementById('displayEmail').textContent = handlerData.email;

            const phone = handlerData.phone_number || '—';
            document.getElementById('displayPhone_number').textContent = phone;

            originalValues.name = handlerData.name;
            originalValues.email = handlerData.email;
            originalValues.phone_number = handlerData.phone_number || '';

            // Profile image
            const img = document.getElementById('profileImage');
            img.src = handlerData.picture;
            img.onerror = () => { img.src = '/assets/default%20user%20icon.png'; };

            // Join date
            const date = handlerData.created_at
                ? new Date(handlerData.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
                : new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('displayJoinDate').textContent = date;
        }

        // ── Editable fields ──
        function enableEdit(field) {
            const container = document.getElementById(field + 'Container');
            const currentVal = document.getElementById('display' + cap(field)).textContent;
            const isEmail = field === 'email';

            container.innerHTML = `
                <div class="edit-row">
                    <input type="${isEmail ? 'email' : 'text'}" id="input${cap(field)}"
                        class="form-control" value="${escapeAttr(currentVal === '—' ? '' : currentVal)}"
                        placeholder="${isEmail ? 'email@example.com' : ''}">
                    <button class="edit-save-btn" onclick="saveField('${field}')">
                        <i class="fas fa-check"></i> Save
                    </button>
                    <button class="edit-cancel-btn" onclick="cancelEdit('${field}')" title="Cancel">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;

            const input = document.getElementById('input' + cap(field));
            input.focus();
            if (field === 'name') input.select();

            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') saveField(field);
                if (e.key === 'Escape') cancelEdit(field);
            });
        }

        async function saveField(field) {
            const input = document.getElementById('input' + cap(field));
            const val = input.value.trim();

            // Validate
            if (field === 'name' && val.length < 2) {
                showToast('Name must be at least 2 characters', 'error'); return;
            }
            if (field === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
                showToast('Please enter a valid email address', 'error'); return;
            }
            if (field === 'phone_number' && val && !/^[\d\s\+\-\(\)]{6,15}$/.test(val)) {
                showToast('Please enter a valid phone number', 'error'); return;
            }
            if (field === 'email' && val === handlerData.email) {
                showToast('This is already your current email', 'info');
                cancelEdit('email'); return;
            }

            // Disable while saving
            const saveBtn = document.querySelector(`#${field}Container .edit-save-btn`);
            if (saveBtn) { saveBtn.disabled = true; saveBtn.innerHTML = '<span class="spinner" style="width:12px;height:12px;border-width:2px;"></span>'; }

            try {
                const payload = {};
                payload[field] = val;
                const { data } = await api.put('/api/handler/profile', payload);
                if (!data.success) throw new Error(data.message);

                if (field === 'name') {
                    handlerData.name = val;
                    document.getElementById('displayFullName').textContent = val;
                } else {
                    handlerData[field] = val || null;
                }
                originalValues[field] = val;
                updateDisplay(field, val);
                showToast(data.message || `${cap(field).replace('_number', ' Number')} updated successfully`);
            } catch (err) {
                console.error(err);
                showToast(err.response?.data?.message || err.message || 'Failed to save changes', 'error');
                if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '<i class="fas fa-check"></i> Save'; }
            }
        }

        function cancelEdit(field) {
            updateDisplay(field, originalValues[field]);
        }

        function updateDisplay(field, value) {
            const container = document.getElementById(field + 'Container');
            const display = value || (field === 'phone_number' ? '—' : '');
            const label = field === 'phone_number' ? 'Phone' : cap(field);
            container.innerHTML = `
                <span class="editable-text" id="display${cap(field)}">${escapeHTML(display)}</span>
                <button class="field-edit-btn" onclick="enableEdit('${field}')" title="Edit ${label}">
                    <i class="fas fa-pen"></i>
                </button>
            `;
        }

        // ── Avatar upload ──
        async function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 2 * 1024 * 1024) { showToast('Image must be under 2MB', 'error'); this.value = ''; return; }
            if (!file.type.match('image.*')) { showToast('Please select an image file', 'error'); this.value = ''; return; }

            // Preview
            const reader = new FileReader();
            reader.onload = ev => { document.getElementById('profileImage').src = ev.target.result; };
            reader.readAsDataURL(file);

            try {
                const formData = new FormData();
                formData.append('picture', file);
                const { data } = await api.post('/api/handler/profile/picture', formData, {
                    headers: { 'Content-Type': 'multipart/form-data' }
                });
                if (!data.success) throw new Error(data.message);
                handlerData.picture = data.data.picture;
                showToast('Profile photo updated successfully');
            } catch (err) {
                document.getElementById('profileImage').src = handlerData.picture;
                showToast(err.response?.data?.message || err.message || 'Failed to upload photo', 'error');
            } finally {
                this.value = '';
            }
        }

        // ── Password modal ──
        function openPasswordModal() {
            clearPasswordErrors();
            ['currentPass', 'newPass', 'confirmPass'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('passwordModal').classList.add('open');
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.remove('open');
        }

        function clearPasswordErrors() {
            ['currentPassError', 'newPassError', 'confirmPassError'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });
            ['currentPass', 'newPass', 'confirmPass'].forEach(id => {
                document.getElementById(id).classList.remove('is-error');
            });
        }

        function setPassError(inputId, errorId, msg) {
            const input = document.getElementById(inputId);
            const err = document.getElementById(errorId);
            input.classList.add('is-error');
            err.querySelector('span').textContent = msg;
            err.style.display = 'flex';
        }

        async function updatePassword() {
            clearPasswordErrors();
            const current = document.getElementById('currentPass').value;
            const newPw = document.getElementById('newPass').value;
            const confirm = document.getElementById('confirmPass').value;
            let valid = true;

            if (!current) { setPassError('currentPass', 'currentPassError', 'Current password is required'); valid = false; }
            if (!newPw) { setPassError('newPass', 'newPassError', 'New password is required'); valid = false; }
            else if (newPw.length < 6) { setPassError('newPass', 'newPassError', 'Password must be at least 6 characters'); valid = false; }
            if (!confirm) { setPassError('confirmPass', 'confirmPassError', 'Please confirm your new password'); valid = false; }
            else if (newPw && newPw !== confirm) { setPassError('confirmPass', 'confirmPassError', 'Passwords do not match'); valid = false; }

            if (!valid) return;

            const saveBtn = document.getElementById('savePasswordBtn');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> Updating…';

            try {
                const { data } = await api.put('/api/handler/profile/password', {
                    currentPassword: current,
                    newPassword: newPw
                });
                if (!data.success) throw new Error(data.message);
                closePasswordModal();
                showToast('Password updated successfully');
            } catch (err) {
                showToast(err.response?.data?.message || err.message || 'Failed to update password', 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fas fa-save"></i> Update Password';
            }
        }

        // ── Helpers ──
        function cap(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

        function escapeHTML(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function escapeAttr(str) {
            return String(str || '').replace(/"/g, '&quot;');
        }
    </script>
</body>

</html>
