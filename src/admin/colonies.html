<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <title>Colony Management — Resolvia</title>
    <link rel="icon" type="image/png" href="/assets/logo_nobg.png">
    <link rel="stylesheet" href="/public/styles/common-styles.css">
    <style>
        /* ── Page-specific only ── */

        /* Compact table — only 4 cols, no image */
        #coloniesTable th:nth-child(1),
        #coloniesTable td:nth-child(1) {
            width: 60px;
            text-align: center;
        }

        #coloniesTable th:nth-child(3),
        #coloniesTable td:nth-child(3) {
            width: 120px;
            text-align: center;
            color: var(--success);
            font-weight: 600;
        }

        #coloniesTable th:nth-child(4),
        #coloniesTable td:nth-child(4) {
            width: 130px;
            text-align: center;
        }

        .action-buttons {
            display: flex;
            gap: var(--space-2);
            justify-content: center;
        }

        .btn-icon-edit {
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            padding: 0 var(--space-3);
            height: 28px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(59, 130, 246, 0.4);
            background: var(--info-light);
            font-size: var(--text-xs);
            font-weight: 600;
            cursor: pointer;
            color: var(--info);
            white-space: nowrap;
            transition: all var(--t-fast);
        }

        .btn-icon-edit:hover {
            background: var(--info);
            color: #fff;
            border-color: var(--info);
            transform: translateY(-1px);
        }

        .btn-icon-delete {
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            padding: 0 var(--space-3);
            height: 28px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(232, 69, 96, 0.3);
            background: var(--danger-light);
            font-size: var(--text-xs);
            font-weight: 600;
            cursor: pointer;
            color: var(--danger);
            white-space: nowrap;
            transition: all var(--t-fast);
        }

        .btn-icon-delete:hover {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
            transform: translateY(-1px);
        }

        /* Toast */
        .toast {
            position: fixed;
            top: calc(var(--header-height) + var(--space-4));
            right: var(--space-5);
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: 500;
            z-index: 5000;
            box-shadow: var(--shadow-lg);
            min-width: 260px;
            max-width: 380px;
            animation: toast-in 0.25s ease;
            border-left: 4px solid transparent;
        }

        @keyframes toast-in {
            from {
                transform: translateX(110%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.success {
            background: var(--success-light);
            border-color: var(--success);
            color: #166534;
        }

        .toast.error {
            background: var(--danger-light);
            border-color: var(--danger);
            color: #9f1239;
        }

        .toast.warning {
            background: var(--warning-light);
            border-color: var(--warning);
            color: #92400e;
        }

        .toast-msg {
            flex: 1;
        }

        .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            cursor: pointer;
            color: inherit;
            opacity: 0.6;
            font-size: 14px;
            padding: 0;
        }

        .toast-close:hover {
            opacity: 1;
        }

        /* Delete confirm modal — danger header */
        #deleteModal .modal-header {
            background: var(--danger);
        }
    </style>
</head>

<body>
    <header>
        <div class="header-left">
            <i class="fa fa-bars" id="menu-control"></i>
            <img src="/assets/logo.png" alt="Resolvia" id="logo">
            <span class="logo-text">Resolvia</span>
        </div>
        <div class="header-right">
            <button id="theme-toggle" title="Toggle theme">
                <i class="fa fa-moon icon-moon"></i>
                <i class="fa fa-sun icon-sun"></i>
            </button>
            <div class="profile-icon"><i class="fa fa-user"></i></div>
            <button class="logout-btn" id="logout-btn">
                <i class="fa fa-sign-out-alt"></i><span>Logout</span>
            </button>
        </div>
    </header>

    <nav class="navigation-menu" id="navigation-menu">
        <ul id="nav-list"></ul>
    </nav>

    <main class="main-content" id="main-content">

        <div class="page-header">
            <div>
                <h1 class="page-title">Colony Management</h1>
                <p class="page-subtitle">Manage colonies and their buildings</p>
            </div>
            <div class="page-actions">
                <button class="btn btn-primary" id="addButton">
                    <i class="fa fa-plus"></i> Add Colony
                </button>
            </div>
        </div>

        <div class="table-toolbar">
            <div class="input-group table-search">
                <i class="fas fa-search input-icon"></i>
                <input type="text" id="searchInput" class="form-control" placeholder="Search colonies by name or ID…">
            </div>
            <div class="table-actions">
                <button class="btn btn-secondary" id="searchButton">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
        </div>

        <div class="table-wrapper" id="tableWrapper">
            <table id="coloniesTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Buildings</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </main>

    <!-- ── Add / Edit Modal ── -->
    <div class="modal-overlay" id="colonyModal">
        <div class="modal" style="max-width:440px;">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add New Colony</h2>
                <button class="modal-close" id="closeModal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Colony Name <span class="form-required">*</span></label>
                    <input type="text" id="colonyName" class="form-control" placeholder="Enter colony name">
                    <span class="form-error" id="colonyNameError" style="display:none;">
                        <i class="fas fa-circle-exclamation"></i> <span>Colony name is required</span>
                    </span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
                <button class="btn btn-primary" id="saveBtn">
                    <i class="fas fa-save"></i> Save Colony
                </button>
            </div>
        </div>
    </div>

    <!-- ── Delete Confirm Modal ── -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal" style="max-width:420px;">
            <div class="modal-header">
                <h2 class="modal-title">Confirm Delete</h2>
                <button class="modal-close" id="closeDeleteModal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p id="deleteMessage" style="color:var(--text-secondary);line-height:1.6;">
                    Are you sure you want to delete this colony? This action cannot be undone.
                </p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelDeleteBtn">Cancel</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">
                    <i class="fas fa-trash"></i> Delete
                </button>
            </div>
        </div>
    </div>

    <script src="/js/axios.min.js"></script>
    <script src="/public/js/api.js"></script>
    <script src="/public/js/common-script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const API_BASE = '/api/colonies';
            let currentColonyId = null, isEditMode = false;

            // ── Toast ──────────────────────────────────────
            function showToast(message, type = 'success') {
                document.querySelectorAll('.toast').forEach(t => t.remove());
                const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', warning: 'fa-triangle-exclamation' };
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `
                    <i class="fas ${icons[type] || icons.success}"></i>
                    <span class="toast-msg">${message}</span>
                    <button class="toast-close"><i class="fas fa-times"></i></button>
                `;
                document.body.appendChild(toast);
                toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
                setTimeout(() => toast?.remove(), 4000);
            }

            // ── Modal helpers ──────────────────────────────
            function openModal(id) { document.getElementById(id).classList.add('open'); }
            function closeModal(id) { document.getElementById(id).classList.remove('open'); }

            // ── Fetch & Render ─────────────────────────────
            async function fetchColonies(searchTerm = '') {
                try {
                    const url = searchTerm ? `${API_BASE}/search` : API_BASE;
                    const params = searchTerm ? { q: searchTerm } : {};
                    const { data: result } = await api.get(url, { params });
                    if (result.success) return result.data;
                    showToast('Failed to load colonies', 'error');
                    return [];
                } catch (err) {
                    console.error(err);
                    showToast('Error loading colonies', 'error');
                    return [];
                }
            }

            async function renderColonies(searchTerm = '') {
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = `<tr><td colspan="4" class="text-center" style="padding:var(--space-8)">
                    <div class="spinner" style="margin:0 auto"></div>
                </td></tr>`;

                const colonies = await fetchColonies(searchTerm);
                tbody.innerHTML = '';

                if (!colonies.length) {
                    tbody.innerHTML = `<tr><td colspan="4">
                        <div class="empty-state">
                            <div class="empty-icon"><i class="fas fa-building"></i></div>
                            <p class="empty-title">No colonies found</p>
                            <p class="empty-text">Click "Add Colony" to get started.</p>
                        </div>
                    </td></tr>`;
                    return;
                }

                colonies.forEach((colony, i) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="text-center text-muted">${i + 1}</td>
                        <td class="font-semibold">${colony.name}</td>
                        <td class="text-center">${colony.buildings_count}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-icon-edit" data-id="${colony.id}" data-name="${colony.name}">
                                    <i class="fas fa-edit"></i> Edit
                                </button>
                                <button class="btn-icon-delete" data-id="${colony.id}" data-name="${colony.name}">
                                    <i class="fas fa-trash"></i> Delete
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // ── Open Modals ────────────────────────────────
            function openAddModal() {
                isEditMode = false; currentColonyId = null;
                document.getElementById('modalTitle').textContent = 'Add New Colony';
                document.getElementById('colonyName').value = '';
                document.getElementById('colonyNameError').style.display = 'none';
                document.getElementById('colonyName').classList.remove('is-error');
                openModal('colonyModal');
                setTimeout(() => document.getElementById('colonyName').focus(), 120);
            }

            function openEditModal(id, name) {
                isEditMode = true; currentColonyId = id;
                document.getElementById('modalTitle').textContent = 'Edit Colony';
                document.getElementById('colonyName').value = name;
                document.getElementById('colonyNameError').style.display = 'none';
                document.getElementById('colonyName').classList.remove('is-error');
                openModal('colonyModal');
                setTimeout(() => { const inp = document.getElementById('colonyName'); inp.focus(); inp.select(); }, 120);
            }

            function openDeleteModal(id, name) {
                currentColonyId = id;
                document.getElementById('deleteMessage').textContent =
                    `Are you sure you want to delete colony "${name}"? This action cannot be undone.`;
                openModal('deleteModal');
                setTimeout(() => document.getElementById('cancelDeleteBtn').focus(), 120);
            }

            // ── Save ───────────────────────────────────────
            async function saveColony() {
                const name = document.getElementById('colonyName').value.trim();
                if (!name) {
                    document.getElementById('colonyName').classList.add('is-error');
                    document.getElementById('colonyNameError').style.display = 'flex';
                    document.getElementById('colonyName').focus();
                    return;
                }

                const btn = document.getElementById('saveBtn');
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> Saving…';

                try {
                    const { data: result } = isEditMode
                        ? await api.put(`${API_BASE}/${currentColonyId}`, { name })
                        : await api.post(API_BASE, { name });

                    if (result.success) {
                        showToast(`Colony "${name}" ${isEditMode ? 'updated' : 'added'} successfully`, 'success');
                        closeModal('colonyModal');
                        await renderColonies(document.getElementById('searchInput').value.trim());
                    } else {
                        showToast(result.message || 'Operation failed', 'error');
                    }
                } catch (err) {
                    console.error(err);
                    showToast('Error saving colony', 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-save"></i> Save Colony';
                }
            }

            // ── Delete ─────────────────────────────────────
            async function deleteColony() {
                const btn = document.getElementById('confirmDeleteBtn');
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> Deleting…';

                try {
                    const { data: result } = await api.delete(`${API_BASE}/${currentColonyId}`);
                    if (result.success) {
                        showToast('Colony deleted successfully', 'success');
                        closeModal('deleteModal');
                        await renderColonies(document.getElementById('searchInput').value.trim());
                    } else {
                        showToast(result.message || 'Delete failed', 'error');
                    }
                } catch (err) {
                    console.error(err);
                    showToast('Error deleting colony', 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-trash"></i> Delete';
                }
            }

            // ── Event Listeners ────────────────────────────
            document.getElementById('addButton').addEventListener('click', openAddModal);
            document.getElementById('searchButton').addEventListener('click', () =>
                renderColonies(document.getElementById('searchInput').value.trim()));
            document.getElementById('searchInput').addEventListener('keypress', e => {
                if (e.key === 'Enter') renderColonies(document.getElementById('searchInput').value.trim());
            });

            document.getElementById('saveBtn').addEventListener('click', saveColony);
            document.getElementById('colonyName').addEventListener('keypress', e => {
                if (e.key === 'Enter') { e.preventDefault(); saveColony(); }
            });

            ['closeModal', 'cancelBtn'].forEach(id =>
                document.getElementById(id).addEventListener('click', () => closeModal('colonyModal')));
            ['closeDeleteModal', 'cancelDeleteBtn'].forEach(id =>
                document.getElementById(id).addEventListener('click', () => closeModal('deleteModal')));

            document.getElementById('confirmDeleteBtn').addEventListener('click', deleteColony);

            // Backdrop close
            ['colonyModal', 'deleteModal'].forEach(id =>
                document.getElementById(id).addEventListener('click', e => {
                    if (e.target === document.getElementById(id)) closeModal(id);
                }));

            // Keyboard
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    closeModal('colonyModal');
                    closeModal('deleteModal');
                }
                if (e.key === 'Enter' && document.getElementById('deleteModal').classList.contains('open')) {
                    e.preventDefault(); deleteColony();
                }
            });

            // Table delegation
            document.getElementById('tableBody').addEventListener('click', e => {
                const editBtn = e.target.closest('.btn-icon-edit');
                const delBtn = e.target.closest('.btn-icon-delete');
                if (editBtn) openEditModal(editBtn.dataset.id, editBtn.dataset.name);
                if (delBtn) openDeleteModal(delBtn.dataset.id, delBtn.dataset.name);
            });

            renderColonies();
        });
    </script>
</body>

</html>
