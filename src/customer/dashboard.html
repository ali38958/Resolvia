<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <title>Dashboard — Resolvia</title>
    <link rel="icon" type="image/png" href="/assets/logo_nobg.png">
    <link rel="stylesheet" href="/public/styles/common-styles.css">
    <style>
        /* ── Page-specific styles only ── */

        /* Welcome Header */
        .welcome-header {
            margin-bottom: var(--space-6);
        }

        .welcome-title {
            font-size: var(--text-3xl);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            line-height: 1.2;
            margin-bottom: var(--space-2);
        }

        .welcome-name-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            background: var(--primary-light);
            color: var(--primary);
            padding: 2px var(--space-3);
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: var(--text-2xl);
            border: 1px solid var(--primary-mid);
            vertical-align: middle;
        }

        .welcome-date {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            color: var(--text-secondary);
            font-size: var(--text-sm);
        }

        .welcome-date i {
            color: var(--primary);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-4);
            margin-bottom: var(--space-6);
        }

        .dash-stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
            box-shadow: var(--shadow-xs);
            cursor: pointer;
            transition: box-shadow var(--t-base), transform var(--t-fast), border-color var(--t-fast);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-3);
        }

        .dash-stat-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--border-strong);
        }

        .dash-stat-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .dash-stat-label {
            font-size: var(--text-xs);
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .dash-stat-value {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--text-primary);
            font-family: var(--font-mono);
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .dash-stat-icon {
            width: 46px;
            height: 46px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .dash-stat-icon.blue {
            background: var(--info-light);
            color: var(--info);
        }

        .dash-stat-icon.orange {
            background: rgba(249, 115, 22, 0.12);
            color: #ea580c;
        }

        .dash-stat-icon.green {
            background: var(--success-light);
            color: var(--success);
        }

        .dash-stat-icon.purple {
            background: rgba(139, 92, 246, 0.12);
            color: #7c3aed;
        }

        /* Two-column layout */
        .row-split {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: var(--space-5);
            margin-bottom: var(--space-5);
        }

        /* Section Cards (shared panel style) */
        .section-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
            box-shadow: var(--shadow-xs);
            transition: background-color var(--t-base), border-color var(--t-base);
        }

        .panel-title {
            font-size: var(--text-md);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.2px;
            margin-bottom: var(--space-4);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .panel-title-icon {
            width: 30px;
            height: 30px;
            border-radius: var(--radius-sm);
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        /* Complaints Table — override common table to be borderless inside panel */
        .complaints-table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--text-sm);
        }

        .complaints-table th {
            background: var(--bg-surface-2);
            color: var(--text-secondary);
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            padding: var(--space-2) var(--space-3);
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .complaints-table th:first-child {
            border-radius: var(--radius-sm) 0 0 var(--radius-sm);
        }

        .complaints-table th:last-child {
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }

        .complaints-table td {
            padding: var(--space-3);
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            vertical-align: middle;
        }

        .complaints-table tr:last-child td {
            border-bottom: none;
        }

        .complaints-table tr:hover td {
            background: var(--bg-surface-2);
        }

        .complaints-table .id-cell {
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            color: var(--text-muted);
            white-space: nowrap;
        }

        .complaints-table .title-cell {
            max-width: 160px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .complaints-table .date-cell {
            font-size: var(--text-xs);
            color: var(--text-secondary);
            white-space: nowrap;
        }

        /* Status Badges */
        .status-pill {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: 700;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }

        .status-pill.pending {
            background: var(--warning-light);
            color: var(--warning);
        }

        .status-pill.in-progress {
            background: var(--info-light);
            color: var(--info);
        }

        .status-pill.on-hold {
            background: var(--bg-surface-2);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .status-pill.completed,
        .status-pill.resolved {
            background: var(--success-light);
            color: var(--success);
        }

        .status-pill.rejected {
            background: var(--danger-light);
            color: var(--danger);
        }

        .status-pill.cancelled {
            background: var(--bg-surface-2);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .status-pill.returned,
        .status-pill.collected {
            background: rgba(139, 92, 246, 0.12);
            color: #7c3aed;
        }

        .status-pill.unavailable {
            background: var(--bg-surface-2);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        /* Table view button */
        .tbl-view-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 0 var(--space-3);
            height: 26px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-strong);
            background: var(--bg-surface);
            color: var(--primary);
            font-size: var(--text-xs);
            font-weight: 600;
            cursor: pointer;
            transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
            white-space: nowrap;
        }

        .tbl-view-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Notifications */
        .notif-list {
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .notif-item {
            display: flex;
            align-items: flex-start;
            gap: var(--space-3);
            padding: var(--space-3) 0;
            border-bottom: 1px solid var(--border);
        }

        .notif-item:last-child {
            border-bottom: none;
        }

        .notif-icon {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .notif-icon.success {
            background: var(--success-light);
            color: var(--success);
        }

        .notif-icon.warning {
            background: var(--warning-light);
            color: var(--warning);
        }

        .notif-icon.error {
            background: var(--danger-light);
            color: var(--danger);
        }

        .notif-icon.info {
            background: var(--info-light);
            color: var(--info);
        }

        .notif-icon.default {
            background: var(--primary-light);
            color: var(--primary);
        }

        .notif-body {
            flex: 1;
            min-width: 0;
        }

        .notif-text {
            font-size: var(--text-sm);
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 3px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .notif-time {
            font-size: var(--text-xs);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .notif-time i {
            color: var(--primary);
            font-size: 10px;
        }

        /* Bottom Row */
        .row-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-5);
        }

        /* Found Items mini card */
        .found-mini-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
            box-shadow: var(--shadow-xs);
            display: flex;
            align-items: center;
            gap: var(--space-4);
            cursor: pointer;
            transition: box-shadow var(--t-base), transform var(--t-fast), border-color var(--t-fast);
            height: 100%;
        }

        .found-mini-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--primary-mid);
        }

        .found-mini-icon {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-md);
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            border: 1px solid var(--primary-mid);
        }

        .found-mini-info {
            flex: 1;
            min-width: 0;
        }

        .found-mini-label {
            font-size: var(--text-xs);
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
        }

        .found-mini-value {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--text-primary);
            font-family: var(--font-mono);
            letter-spacing: -0.5px;
            line-height: 1;
            margin-bottom: 4px;
        }

        .found-mini-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: var(--text-xs);
            color: var(--text-secondary);
        }

        .found-mini-tag i {
            color: var(--success);
            font-size: 10px;
        }

        /* Quick Actions */
        .quick-action-btns {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
            margin-bottom: var(--space-3);
        }

        .qa-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            padding: 0 var(--space-4);
            height: 38px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-strong);
            background: var(--bg-surface);
            color: var(--text-primary);
            font-size: var(--text-sm);
            font-weight: 600;
            cursor: pointer;
            transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast);
            white-space: nowrap;
            text-decoration: none;
        }

        .qa-btn i {
            color: var(--primary);
            font-size: 13px;
            transition: color var(--t-fast);
        }

        .qa-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 14px rgba(var(--primary-rgb), 0.3);
            transform: translateY(-1px);
        }

        .qa-btn:hover i {
            color: #fff;
        }

        .pending-note {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            font-size: var(--text-xs);
            color: var(--text-secondary);
            background: var(--bg-surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            padding: 5px var(--space-3);
        }

        .pending-note i {
            color: var(--primary);
            font-size: 11px;
        }

        /* Empty / Loading states */
        .table-empty {
            text-align: center;
            padding: var(--space-8);
            color: var(--text-muted);
            font-size: var(--text-sm);
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .row-split {
                grid-template-columns: 1fr;
            }

            .row-bottom {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .welcome-title {
                font-size: var(--text-xl);
            }

            .welcome-name-badge {
                font-size: var(--text-lg);
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .qa-btn span {
                display: inline;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-left">
            <i class="fa fa-bars" id="menu-control"></i>
            <img src="/assets/logo.png" alt="Resolvia" id="logo">
            <span class="logo-text">Resolvia</span>
        </div>
        <div class="header-right">
            <button id="theme-toggle" title="Toggle theme">
                <i class="fa fa-moon icon-moon"></i>
                <i class="fa fa-sun icon-sun"></i>
            </button>
            <div class="profile-icon"><i class="fa fa-user"></i></div>
            <button class="logout-btn" id="logout-btn">
                <i class="fa fa-sign-out-alt"></i>
                <span>Logout</span>
            </button>
        </div>
    </header>

    <nav class="navigation-menu" id="navigation-menu">
        <ul id="nav-list"></ul>
    </nav>

    <main class="main-content" id="main-content">

        <!-- Welcome Header -->
        <div class="welcome-header">
            <h1 class="welcome-title">
                Welcome, <span class="welcome-name-badge" id="userNameDisplay">Sarah</span>
            </h1>
            <div class="welcome-date" id="todayDateDisplay">
                <i class="fa-regular fa-calendar-alt"></i>
                <span></span>
            </div>
        </div>

        <!-- Stats Row -->
        <div class="stats-grid">
            <div class="dash-stat-card" onclick="location.href='/customer/my-complaints'">
                <div class="dash-stat-content">
                    <span class="dash-stat-label">Total Complaints</span>
                    <span class="dash-stat-value" id="totalComplaintsCount">0</span>
                </div>
                <div class="dash-stat-icon blue"><i class="fa fa-file-alt"></i></div>
            </div>
            <div class="dash-stat-card" onclick="location.href='/customer/my-complaints?status=In Progress'">
                <div class="dash-stat-content">
                    <span class="dash-stat-label">In Progress</span>
                    <span class="dash-stat-value" id="inProgressCount">0</span>
                </div>
                <div class="dash-stat-icon orange"><i class="fa fa-spinner"></i></div>
            </div>
            <div class="dash-stat-card" onclick="location.href='/customer/my-complaints?status=Completed'">
                <div class="dash-stat-content">
                    <span class="dash-stat-label">Resolved</span>
                    <span class="dash-stat-value" id="resolvedCount">0</span>
                </div>
                <div class="dash-stat-icon green"><i class="fa fa-check-circle"></i></div>
            </div>
            <div class="dash-stat-card" onclick="location.href='/customer/my-found-items'">
                <div class="dash-stat-content">
                    <span class="dash-stat-label">Found Items</span>
                    <span class="dash-stat-value" id="lostFoundCount">0</span>
                </div>
                <div class="dash-stat-icon purple"><i class="fa fa-exchange-alt"></i></div>
            </div>
        </div>

        <!-- Recent Complaints + Notifications -->
        <div class="row-split">

            <!-- Recent Complaints -->
            <div class="section-panel">
                <h2 class="panel-title">
                    <span class="panel-title-icon"><i class="fa fa-clock"></i></span>
                    Recent Complaints
                </h2>
                <div class="table-wrapper"
                    style="border:none; box-shadow:none; border-radius:var(--radius-md); overflow:hidden;">
                    <table class="complaints-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="complaintTableBody">
                            <tr>
                                <td colspan="5" class="table-empty">
                                    <div class="spinner" style="margin: 0 auto;"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Notifications -->
            <div class="section-panel">
                <h2 class="panel-title">
                    <span class="panel-title-icon"><i class="fa fa-bell"></i></span>
                    Notifications
                </h2>
                <ul class="notif-list" id="notificationList">
                    <li class="notif-item">
                        <div class="notif-icon default"><i class="fas fa-circle-notch fa-spin"></i></div>
                        <div class="notif-body">
                            <div class="notif-text">Loading notifications…</div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Found Items + Quick Actions -->
        <div class="row-bottom">

            <!-- Found Items Mini Card -->
            <div class="found-mini-card" onclick="location.href='/customer/my-found-items'">
                <div class="found-mini-icon"><i class="fa fa-hand-holding-heart"></i></div>
                <div class="found-mini-info">
                    <div class="found-mini-label">My Found Items</div>
                    <div class="found-mini-value" id="myFoundCount">0</div>
                    <div class="found-mini-tag" id="myFoundStatus">
                        <i class="fa fa-check-circle"></i> 0 returned
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="section-panel">
                <h2 class="panel-title">
                    <span class="panel-title-icon"><i class="fa fa-bolt"></i></span>
                    Quick Actions
                </h2>
                <div class="quick-action-btns">
                    <button class="qa-btn" onclick="location.href='/customer/submit-complaint'">
                        <i class="fa fa-plus-circle"></i> <span>Submit Complaint</span>
                    </button>
                    <button class="qa-btn" onclick="location.href='/customer/submit-found'">
                        <i class="fa fa-hand-holding-heart"></i> <span>Submit Found</span>
                    </button>
                    <button class="qa-btn" onclick="location.href='/customer/my-complaints'">
                        <i class="fa fa-list-alt"></i> <span>My Complaints</span>
                    </button>
                </div>
                <div class="pending-note" id="pendingReportsNote">
                    <i class="fa fa-info-circle"></i>
                    <span>0 pending reports need attention</span>
                </div>
            </div>
        </div>

    </main>

    <script src="/js/axios.min.js"></script>
    <script src="/public/js/api.js"></script>
    <script src="/public/js/common-script.js"></script>
    <script>
        // ── Toast ──────────────────────────────────────────────────
        function showToast(message, type = 'success') {
            document.querySelectorAll('.toast').forEach(t => t.remove());
            const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', warning: 'fa-triangle-exclamation' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.success}"></i>
                <span style="flex:1">${message}</span>
                <button class="toast-close"><i class="fas fa-times"></i></button>`;
            document.body.appendChild(toast);
            toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
            setTimeout(() => toast?.remove(), 4000);
        }

        // ── Date ───────────────────────────────────────────────────
        function updateTodayDate() {
            const el = document.querySelector('#todayDateDisplay span');
            if (el) {
                el.textContent = new Date().toLocaleDateString('en-US', {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                });
            }
        }

        // ── Render helpers ─────────────────────────────────────────
        function escapeHTML(str) {
            return String(str).replace(/[&<>"']/g, m =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toISOString().split('T')[0];
        }

        function formatTimeAgo(dateStr) {
            const secs = Math.floor((Date.now() - new Date(dateStr)) / 1000);
            if (secs < 60) return 'just now';
            const mins = Math.floor(secs / 60);
            if (mins < 60) return `${mins}m ago`;
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return `${hrs}h ago`;
            const days = Math.floor(hrs / 24);
            return days === 1 ? 'yesterday' : `${days} days ago`;
        }

        function getNotifIcon(type) {
            if (type.includes('progress')) return 'fa-clock';
            if (type.includes('resolved') || type.includes('completed')) return 'fa-check-circle';
            if (type.includes('rejected')) return 'fa-times-circle';
            return 'fa-bell';
        }

        function getNotifType(type) {
            if (type.includes('progress')) return 'warning';
            if (type.includes('resolved') || type.includes('completed')) return 'success';
            if (type.includes('rejected')) return 'error';
            return 'info';
        }

        // ── Render Stats ───────────────────────────────────────────
        function renderStats(stats) {
            document.getElementById('totalComplaintsCount').textContent = stats.complaints.total ?? 0;
            document.getElementById('inProgressCount').textContent = stats.complaints.inprogress ?? 0;
            document.getElementById('resolvedCount').textContent = stats.complaints.resolved ?? 0;
            document.getElementById('lostFoundCount').textContent = stats.lostFound?.myFound?.total ?? 0;
            document.getElementById('myFoundCount').textContent = stats.lostFound?.myFound?.total ?? 0;
            document.getElementById('myFoundStatus').innerHTML =
                `<i class="fa fa-check-circle"></i> ${stats.lostFound?.myFound?.returned ?? 0} returned`;
            document.getElementById('pendingReportsNote').innerHTML =
                `<i class="fa fa-info-circle"></i> <span>${stats.complaints.pending ?? 0} pending reports need attention</span>`;
        }

        // ── Render Complaints Table ────────────────────────────────
        function renderRecentComplaints(complaints) {
            const tbody = document.getElementById('complaintTableBody');
            if (!complaints?.length) {
                tbody.innerHTML = `<tr><td colspan="5">
                    <div class="empty-state" style="padding:var(--space-8) var(--space-4);">
                        <div class="empty-icon"><i class="fas fa-file-alt"></i></div>
                        <p class="empty-title">No complaints yet</p>
                        <p class="empty-text">Submit your first complaint to get started.</p>
                    </div>
                </td></tr>`;
                return;
            }
            tbody.innerHTML = complaints.map(c => {
                const statusClass = c.status.toLowerCase().replace(/\s+/g, '-');
                return `<tr>
                    <td class="id-cell">#${escapeHTML(c.id)}</td>
                    <td class="title-cell" title="${escapeHTML(c.title)}">${escapeHTML(c.title)}</td>
                    <td class="date-cell">${formatDate(c.date)}</td>
                    <td><span class="status-pill ${statusClass}">${escapeHTML(c.status)}</span></td>
                    <td>
                        <button class="tbl-view-btn" onclick="location.href='/customer/my-complaints?search=${encodeURIComponent(c.id)}'">
                            <i class="fa fa-eye"></i> View
                        </button>
                    </td>
                </tr>`;
            }).join('');
        }

        // ── Render Notifications ───────────────────────────────────
        function renderNotifications(notifications) {
            const list = document.getElementById('notificationList');
            if (!notifications?.length) {
                list.innerHTML = `<li class="notif-item" style="justify-content:center;">
                    <span style="color:var(--text-muted);font-size:var(--text-sm);">No recent notifications</span>
                </li>`;
                return;
            }
            list.innerHTML = notifications.map(n => {
                const t = getNotifType(n.type);
                return `<li class="notif-item">
                    <div class="notif-icon ${t}"><i class="fa ${getNotifIcon(n.type)}"></i></div>
                    <div class="notif-body">
                        <div class="notif-text">${escapeHTML(n.text)}</div>
                        <div class="notif-time">
                            <i class="fa-regular fa-clock"></i> ${formatTimeAgo(n.time)}
                        </div>
                    </div>
                </li>`;
            }).join('');
        }

        // ── Fetch Data ─────────────────────────────────────────────
        async function fetchDashboardData() {
            try {
                const profileRes = await api.get('/api/customer/profile');
                if (profileRes.data.success) {
                    const name = profileRes.data.data.fullName;
                    document.getElementById('userNameDisplay').textContent = name.split(' ')[0];
                }

                const summaryRes = await api.get('/api/customer/dashboard-summary');
                if (summaryRes.data.success) {
                    const d = summaryRes.data.data;
                    renderStats(d.stats);
                    renderRecentComplaints(d.recentComplaints);
                    renderNotifications(d.notifications);
                }
            } catch (err) {
                console.error('Dashboard error:', err);
                if (err.response?.status === 401) {
                    window.location.href = '/login';
                } else {
                    showToast('Failed to load dashboard data', 'error');
                }
            }
        }

        // ── Init ───────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            updateTodayDate();
            fetchDashboardData();
        });
    </script>
</body>

</html>
